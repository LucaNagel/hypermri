    // Python chooses the layer, range and slice of the new source.
    const source = select(options.data_sources, settings.data_source);
    source.addEventListener("change", () => send({ data_source: source.value }));
    items.push(labelled("overlay source", source));
  }
  if (options.slice_count > 1) {
    // "" lets the overlay plane follow the map; a number fixes the slice.
    // While following, the label names the overlay slice drawn now.
    const followed = settings.slice == null ? v.view.overlay?.slice_index : null;
    const choices = [[followed == null ? "follow map" : `follow map (${followed})`, ""]];
    for (let index = 0; index < options.slice_count; index += 1) {
      choices.push([String(index), String(index)]);
    }
    const chosen = settings.slice == null ? "" : String(settings.slice);
    const slice = select(choices, chosen);
    slice.addEventListener("change", () =>
      send({ slice: slice.value === "" ? null : Number(slice.value) }),
    );
    items.push(labelled(`overlay ${options.slice_dim}`, slice));
  }
  const cmap = select(options.cmaps, settings.cmap);
  cmap.addEventListener("change", () => send({ cmap: cmap.value }));
  items.push(labelled("overlay colours", cmap));
  const opacity = opacitySlider(
    v.model.get("_overlay_opacity"),
    "Opacity of the overlay above the CSI map",
  );
  // Redrawn by onOverlayOpacity; saved to Python when the slider is released.
  opacity.addEventListener("input", () => v.model.set("_overlay_opacity", Number(opacity.value)));
  opacity.addEventListener("change", () => v.model.save_changes());
  v.overlayOpacitySlider = opacity;
  const percent = settings.range_mode === "Percentage";
  const mode = select(options.range_modes, settings.range_mode);
  mode.addEventListener("change", () => sendSelection({ range_mode: mode.value }));
  const lower = limitInput(v, settings.vmin, (value) => {
    if (value >= settings.vmax) return false;
    send({ vmin: value });
    return true;
  });
  const upper = limitInput(v, settings.vmax, (value) => {
    if (value <= settings.vmin) return false;
    send({ vmax: value });
    return true;
  });
  const unit = percent ? " [%]" : "";
  items.push(
    labelled("overlay opacity", opacity),
    labelled("overlay range", mode),
    labelled(`min${unit}`, lower),
    labelled(`max${unit}`, upper),
  );
  if (v.view.overlay?.warning) {
    items.push(element("span", "hm-csi-mask-error", v.view.overlay.warning));
  }
  return items;
}

function onOverlayOpacity(v) {
  const value = v.model.get("_overlay_opacity");
  const slider = v.overlayOpacitySlider;
  if (slider && Number(slider.value) !== value) slider.value = value;
  if (v.Plotly) drawImagePanel(v);
}

// ---- browser/controls_masks.js ----

// Control group "masks": add, choose, style, draw and delete masks, and show
// the mean spectrum inside a mask.
//
// Python sends each mask's coverage of the shown plane in `_mask_planes`.
// Drawn outlines (in map axis units) go to Python as `{type: "mask"}`
// messages; Python rasterizes and stores them and answers with new
// `_mask_planes`.
//
// Views linked with ScanView.link_masks (same `_mask_link`) share the chosen
// mask, the drawing tool and the add/erase mode through MASK_EVENTS, so one
// tool draws on all of them; Python copies the drawn masks between the scans.
// A linked view with `_mask_tool_shown` false (the second and later images of
// plot_side_by_side) shows only the chosen mask, its volume and the ROI mean.

const MASK_EVENTS = (globalThis.hypermriMaskEvents ??= new EventTarget());

function shareMaskTool(v) {
  const link = v.model.get("_mask_link");
  if (!link) return;
  const detail = { link, source: v, activeMask: v.activeMask, tool: v.tool, erase: v.erase };
  MASK_EVENTS.dispatchEvent(new CustomEvent("masktool", { detail }));
}

function onLinkedMaskTool(v, event) {
  const { link, source, activeMask, tool, erase } = event.detail;
  if (source === v || !link || link !== v.model.get("_mask_link")) return;
  const toolChanged = tool !== v.tool;
  v.activeMask = activeMask;
  v.tool = tool;
  v.erase = erase;
  if (toolChanged) v.pending = [];
  // A mask added in the other view arrives later with `_mask_planes`;
  // rebuilding the controls now would replace the chosen name by an
  // existing one. The image is redrawn anyway, so this view draws with the
  // new tool (freehand needs Plotly's drawing drag mode).
  if (v.maskPlanes.some((mask) => mask.name === activeMask)) buildMaskControls(v);
  if (v.Plotly) draw(v, { curve: false });
}

function sendMask(v, action, content = {}) {
  v.maskMessage = "";
  v.model.send({ type: "mask", action, mask: v.activeMask, ...content });
}

function commitOutline(v, points) {
  if (points.length < 2) return;
  if (!v.activeMask) {
    v.maskMessage = "Add a mask first.";
    buildMaskControls(v);
    return;
  }
  sendMask(v, "draw", { vertices: points, erase: v.erase });
}

function finishPolygon(v) {
  const points = v.pending;
  v.pending = [];
  commitOutline(v, points);
  if (v.Plotly) drawImagePanel(v);
}

// "Close outline" (or Enter) commits the polygon clicked in this view or in a
// mask-linked one: the button sits in the first image only, but corners may
// have been clicked in another. Drawing then stops in all linked views.
function closeOutline(v) {
  finishPolygon(v);
  const link = v.model.get("_mask_link");
  if (link) {
    MASK_EVENTS.dispatchEvent(new CustomEvent("closeoutline", { detail: { link, source: v } }));
  }
  v.tool = "off";
  shareMaskTool(v);
  buildMaskControls(v);
  if (v.Plotly) draw(v, { curve: false });
}

function onLinkedCloseOutline(v, event) {
  const { link, source } = event.detail;
  if (source === v || link !== v.model.get("_mask_link") || !v.pending.length) return;
  finishPolygon(v);
}

function maskControls(v) {
  if (v.view.single_voxel) return [];
  if (v.view.mask_unavailable_reason) {
    return [element("span", "hm-csi-control-label", `Masks: ${v.view.mask_unavailable_reason}`)];
  }
  const names = v.maskPlanes.map((mask) => mask.name);
  if (!names.includes(v.activeMask)) v.activeMask = names.length ? names[names.length - 1] : "";
  const active = v.maskPlanes.find((mask) => mask.name === v.activeMask);

  const newName = element("input");
  newName.type = "text";
  newName.placeholder = "new mask name";
  newName.size = 12;
  const newColour = element("input");
  newColour.type = "color";
  newColour.value = "#ff0000";
  const add = button("Add", "Create an empty mask");
  add.addEventListener("click", () => {
    const name = newName.value.trim() || `mask${names.length + 1}`;
    v.activeMask = name;
    shareMaskTool(v);
    sendMask(v, "add", { mask: name, color: newColour.value, alpha: 0.4 });
  });

  const choice = select(names.length ? names : ["(none)"], v.activeMask || "(none)");
  choice.disabled = !names.length;
  choice.addEventListener("change", () => {
    v.activeMask = choice.value;
    shareMaskTool(v);
    if (v.roiMean.mask) v.model.send({ type: "roi_mean", mask: v.activeMask });
    if (v.timeCourse.mask) sendTimeCourse(v, { mask: v.activeMask });
    buildMaskControls(v);
    if (v.Plotly) drawImagePanel(v);
  });
  const colour = element("input");
  colour.type = "color";
  colour.value = active?.color || "#ff0000";
  colour.disabled = !active;
  colour.addEventListener("change", () => sendMask(v, "style", { color: colour.value }));
  const opacity = opacitySlider(active?.alpha ?? 0.4);
  opacity.disabled = !active;
  opacity.addEventListener("change", () => sendMask(v, "style", { alpha: Number(opacity.value) }));

  const toolChoice = select(["off", "polygon", "freehand"], v.tool);
  toolChoice.addEventListener("change", () => {
    v.tool = toolChoice.value;
    v.pending = [];
    shareMaskTool(v);
    buildMaskControls(v);
    if (v.Plotly) draw(v, { curve: false });
    v.el.focus({ preventScroll: true });
  });
  const mode = select(["add", "erase"], v.erase ? "erase" : "add");
  mode.addEventListener("change", () => {
    v.erase = mode.value === "erase";
    shareMaskTool(v);
    if (v.Plotly) drawImagePanel(v);
  });
  const close = button("Close outline", "Commit the clicked polygon (Enter)");
  close.disabled = v.tool !== "polygon";
  close.addEventListener("click", () => closeOutline(v));
  const undo = button("Undo", "Undo the last outline");
  undo.addEventListener("click", () => sendMask(v, "undo"));
  const remove = button("Delete", "Delete the selected mask");
  remove.disabled = !active;
  remove.addEventListener("click", () => {
    if (active && window.confirm(`Delete mask ${active.name}?`)) sendMask(v, "remove");
  });

  const roiBox = element("input");
  roiBox.type = "checkbox";
  roiBox.checked = Boolean(v.roiMean.mask);
  roiBox.disabled = !active;
  roiBox.title =
    "Show the mean magnitude inside the mask (supplied samples, no FFT) instead of the voxel spectrum";
  roiBox.addEventListener("change", () => {
    v.model.send({ type: "roi_mean", mask: roiBox.checked ? v.activeMask : null });
  });

  const info = element("span", "hm-csi-mask-info");
  if (active) {
    const volume =
      active.volume_ml === null || active.volume_ml === undefined
        ? ""
        : `, ${active.volume_ml.toPrecision(3)} mL`;
    info.textContent = `${active.weighted_voxel_count.toFixed(2)} voxels${volume}`;
  }
  const message = element("span", "hm-csi-mask-error", v.maskMessage);
  // An image without a curve panel has no curve to average.
  const roi = v.view.curve_dim === null ? [] : [labelled("ROI mean", roiBox)];

  if (!v.model.get("_mask_tool_shown")) {
    const name = element("span", "hm-csi-mask-info", active ? active.name : "(none)");
    if (active) name.style.color = active.color;
    return [labelled("mask", name), info, ...roi, message];
  }

  const group = labelled("mask", choice);
  group.append(colour);
  return [
    labelled("new", newName),
    newColour,
    add,
    group,
    labelled("opacity", opacity),
    labelled("draw", toolChoice),
    labelled("mode", mode),
    close,
    undo,
    remove,
    ...roi,
    info,
    message,
  ];
}

function onMaskPlanes(v) {
  v.maskPlanes = v.model.get("_mask_planes") || [];
  v.cachedHoverIndices = hoverIndices(v);
  buildMaskControls(v);
  buildGroups(v, ["time_course"]);
  if (v.Plotly) drawImagePanel(v);
}

function onMaskToolShown(v) {
  buildGroups(v, ["tool", "masks"]);
}

function onRoiMean(v) {
  v.roiMean = v.model.get("_roi_mean") || {};
  buildMaskControls(v);
  if (v.Plotly) drawCurvePanel(v);
}

// ---- browser/controls_fit.js ----

// Control group "fit": find spectral lines or add them at the spectral
// cursor, edit them in a table, fit all voxels and, after a fit, align the
// voxel spectra to the weighted mean fitted frequency (or undo that).
// "Advanced" shows the remaining detection and fit settings and the coupling
// columns of the table (T2* leader and ratio, phase band); whether it is open
// is kept in the browser only. "Lines from fit" fills the table from an
// earlier fit (stored on the scan or run here); the "start from earlier fit"
// columns take each line's frequency and T2* per voxel from it. After a fit,
// "Review" refits the selected voxel with the table, jumps to the next
// problem voxel (a line at a bound first, then the worst fit) and searches
// the selected voxel's residual for one more line in a range typed in Hz
// (kept in the browser only). Settings
// and table are tables with coloured groups; each line has a colour, also
// used for its frequency search range drawn in the spectrum.
//
// Python owns the table and the settings (`_fit_tool`, see
// hypermri.visualization.fit_tool). Every edit goes to Python as a
// `{type: "fit"}` message; Python answers with a new `_fit_tool`, and after
// a fit with the result as overlay "fit" and the fitted spectrum.

function sendFit(v, action, content = {}) {
  v.model.send({ type: "fit", action, ...content });
}

// A number input that sends its value when it is changed.
function fitNumber(value, width, title, onChange) {
  const input = element("input");
  input.type = "number";
  input.step = "any";
  input.value = Number.isFinite(value) ? String(Number(value.toPrecision(6))) : "";
  input.style.width = `${width}em`;
  if (title) input.title = title;
  input.addEventListener("change", () => onChange(Number(input.value)));
  return input;
}

function fitCheckbox(checked, title, onChange) {
  const box = element("input");
  box.type = "checkbox";
  box.checked = Boolean(checked);
  box.title = title;
  box.addEventListener("change", () => onChange(box.checked));
  return box;
}

function fitOption(v, settings, name, label, title, width = 4) {
  const input = fitNumber(settings[name], width, title, (value) =>
    sendFit(v, "option", { name, value }),
  );
  return labelled(label, input);
}

function fitOptionCheckbox(v, settings, name, label, title) {
  const box = fitCheckbox(settings[name], title, (value) =>
    sendFit(v, "option", { name, value }),
  );
  return labelled(label, box);
}

// Advanced settings: [setting, label, title, width].
const FIT_DETECTION_OPTIONS = [
  ["prominence_snr", "prominence SNR", "Smallest peak prominence in noise units"],
  ["max_peaks_per_spectrum", "peaks/voxel", "Most peaks taken from one voxel spectrum", 3],
  ["min_peak_distance_hz", "peak dist Hz", "Smallest distance of two peaks in one spectrum"],
  ["b0_shift_tolerance_hz", "B0 tol Hz", "Largest shift in Hz of a peak from its line centre between voxels"],
  ["cluster_min_separation_hz", "line sep Hz", "Drop weaker lines closer than this to a stronger one; 0 keeps all"],
  ["snr_threshold_factor", "fit SNR factor", "Fit amplitude threshold in multiples of the FID tail noise; 0 is off"],
];
const FIT_FIT_OPTIONS = [
  ["min_peak_separation_hz", "fit sep Hz", "Smallest distance in Hz of fitted line frequencies"],
  ["rep_fitting", "repeats", "Repetitions of the start-value search; 0 chooses automatically", 3],
  ["npoints", "grid points", "Grid points per parameter of the start-value search; 0 chooses automatically", 3],
  ["nsamplepoints", "FID points", "Leading FID samples fitted; 0 fits all", 4],
  ["phase_band_tau_ms", "phase tau ms", "Common delay of the phase band in ms; 0 derives it from the scan timing"],
];

// Colours of the table lines; a line's search range in the spectrum has the
// same colour. Blue (data) and red (fit, cursor) are left out.
const FIT_LINE_COLOURS = ["#2ca02c", "#ff7f0e", "#9467bd", "#8c564b", "#e377c2", "#17becf", "#bcbd22", "#7f7f7f"];

// Name field and "Save fit" button of a fit tool. `type` is the message
// type of the tool ("fit", "curve_fit" or "ideal"); Python copies the last
// fit into saved_fits of the plotted scan or DataArray. The typed name is
// kept per tool while the controls are rebuilt.
function saveFitItems(v, type, fitted) {
  v.savedFitNames = v.savedFitNames || {};
  const name = element("input");
  name.type = "text";
  name.value = v.savedFitNames[type] || "";
  name.placeholder = "automatic";
  name.title = "Name of the saved fit: a letter, then letters, digits, _ or -; empty chooses one";
  name.style.width = "8em";
  name.addEventListener("input", () => {
    v.savedFitNames[type] = name.value;
  });
  const save = button(
    "Save fit",
    "Store a copy of the last fit on the plotted scan (scan.saved_fits) or DataArray; " +
      "it stays an overlay under its name and is shown again when the object is plotted",
  );
  save.disabled = !fitted;
  save.addEventListener("click", () => {
    v.model.send({ type, action: "save", name: name.value });
    v.savedFitNames[type] = "";
  });
  return [labelled("save as", name), save];
}

function fitLineColour(row) {
  return FIT_LINE_COLOURS[row % FIT_LINE_COLOURS.length];
}

// The settings of the tool as a table: one row per titled group, its title
// in a coloured first cell (`kind` chooses the colour, see viewer.css).
function settingsTable(rows) {
  const table = element("table", "hm-csi-fit-settings");
  for (const [title, kind, items] of rows) {
    const line = element("tr", `hm-csi-fit-kind-${kind}`);
    line.append(element("th", "", title));
    const cell = element("td");
    const content = element("div", "hm-csi-fit-settings-items");
    content.append(...items);
    cell.append(content);
    line.append(cell);
    table.append(line);
  }
  return table;
}

function fitAdvancedRows(v, settings) {
  const options = (list) =>
    list.map(([name, label, help, width]) => fitOption(v, settings, name, label, help, width));
  const fitItems = options(FIT_FIT_OPTIONS);
  fitItems.push(
    fitOptionCheckbox(
      v,
      settings,
      "t2_coupling_clip_start",
      "clip coupled T2*",
      "Move T2* starts of coupled lines into their ratio band instead of failing",
    ),
  );
  return [
    ["Detection", "detect", options(FIT_DETECTION_OPTIONS)],
    ["Fit options", "options", fitItems],
  ];
}

// Columns of the peak table: [heading, column, kind, title, group, width].
// Columns of one group share a tinted background and a heading above them;
// `width` (em) of a number input defaults to NUMBER_WIDTH.
// Width in em of a number input in the peak table.
const NUMBER_WIDTH = 5;

const FIT_COLUMNS = [
  ["line", "name", "text", "Name of the line (metabolite)", "line"],
  ["Hz", "freq_hz", "number", "Start frequency in Hz", "freq", 7],
  ["range Hz", "freq_range_hz", "number", "Full frequency search width in Hz; shown as band in the spectrum", "freq", 4.5],
  ["fix", "fixed_freq", "check", "Keep the frequency at its start value", "freq"],
  ["ms", "initial_t2_ms", "number", "Start T2* in ms", "t2", 6],
  ["min", "min_t2_ms", "number", "Smallest T2* in ms", "t2", 4],
  ["max", "max_t2_ms", "number", "Largest T2* in ms", "t2", 4],
  ["fix", "fixed_t2", "check", "Keep T2* at its start value", "t2"],
  ["freq", "freq_from_fit", "check", "Start frequency per voxel from the earlier fit", "seed"],
  ["T2*", "t2_from_fit", "check", "Start T2* per voxel from the earlier fit", "seed"],
  ["win ms", "t2_window_ms", "number", "T2* bounds: start ± half this width per voxel (with T2* from fit); 0 keeps min/max", "seed"],
  ["fit", "fit", "check", "Fit this line; off leaves it out", "line"],
];

// Coupling columns, shown with the advanced settings.
const FIT_COUPLING_COLUMNS = [
  ["T2* leader", "t2_leader", "leader", "Line whose T2* this line follows", "coupling"],
  ["ratio min", "t2_ratio_low", "number", "Smallest ratio T2*(line) / T2*(leader)", "coupling"],
  ["max", "t2_ratio_high", "number", "Largest ratio; equal to min fixes the ratio", "coupling"],
  ["phase", "phase_band", "check", "Join the common phase law of the phase band", "coupling"],
  ["tol °", "phase_tol_deg", "number", "Allowed phase deviation in degrees", "coupling"],
];

const FIT_COLUMN_GROUPS = {
  line: "",
  freq: "frequency",
  t2: "T2*",
  seed: "start from earlier fit",
  coupling: "coupling",
};

function fitTable(v, peaks, advanced) {
  const columns = advanced ? [...FIT_COLUMNS, ...FIT_COUPLING_COLUMNS] : FIT_COLUMNS;
  const table = element("table", "hm-csi-fit-table");
  // Group headings over neighbouring columns of one group.
  const groups = element("tr", "hm-csi-fit-groups");
  groups.append(element("th"));
  columns.forEach(([, , , , group], index) => {
    if (index > 0 && columns[index - 1][4] === group) {
      groups.lastChild.colSpan += 1;
      return;
    }
    const cell = element("th", `hm-csi-fit-col-${group}`, FIT_COLUMN_GROUPS[group]);
    cell.colSpan = 1;
    groups.append(cell);
  });
  groups.append(element("th"));
  const head = element("tr");
  head.append(element("th"));
  for (const [heading, , , , group] of columns) {
    head.append(element("th", `hm-csi-fit-col-${group}`, heading));
  }
  head.append(element("th"));
  table.append(groups, head);
  peaks.forEach((peak, row) => {
    const line = element("tr");
    if (peak.fit === false) line.classList.add("hm-csi-fit-off");
    const swatch = element("td", "hm-csi-fit-swatch");
    swatch.style.background = fitLineColour(row);
    swatch.title = "Colour of this line's search range in the spectrum";
    line.append(swatch);
    for (const [, column, kind, title, group, width = NUMBER_WIDTH] of columns) {
      const edit = (value) => sendFit(v, "edit", { row, column, value });
      let input;
      if (kind === "check") {
        input = fitCheckbox(peak[column], title, edit);
      } else if (kind === "leader") {
        const others = peaks.filter((_, other) => other !== row).map((p) => [p.name, p.name]);
        input = select([["none", ""], ...others], peak[column]);
        input.title = title;
        input.addEventListener("change", () => edit(input.value));
      } else if (kind === "number") {
        input = fitNumber(peak[column], width, title, edit);
      } else {
        input = element("input");
        input.type = "text";
        input.size = 8;
        input.value = peak[column];
        input.title = title;
        input.addEventListener("change", () => edit(input.value));
      }
      // A window only acts on a line whose T2* starts from the earlier fit.
      if (column === "t2_window_ms") input.disabled = !peak.t2_from_fit || peak.fixed_t2;
      const cell = element("td", `hm-csi-fit-col-${group}`);
      cell.append(input);
      line.append(cell);
    }
    const remove = button("×", `Remove ${peak.name}`);
    remove.addEventListener("click", () => sendFit(v, "remove", { row }));
    const cell = element("td");
    cell.append(remove);
    line.append(cell);
    table.append(line);
  });
  // A wide table (advanced columns) scrolls instead of being cut off.
  const scroller = element("div", "hm-csi-fit-table-scroll");
  scroller.append(table);
  return scroller;
}

function fitControls(v) {
  const settings = v.model.get("_fit_tool") || {};
  if (!settings.offered) return [];
  const peaks = settings.peaks || [];

  const detect = button("Detect lines", "Find lines automatically; replaces the table");
  detect.addEventListener("click", () => sendFit(v, "detect"));
  const add = button("Add at cursor", "Add a line at the spectral cursor (click the spectrum)");
  add.addEventListener("click", () => sendFit(v, "add_at_cursor"));
  const advanced = button(
    v.fitAdvanced ? "Advanced ▾" : "Advanced ▸",
    "Show or hide the remaining detection and fit settings and the coupling columns",
  );
  advanced.addEventListener("click", () => {
    v.fitAdvanced = !v.fitAdvanced;
    buildGroups(v, ["fit"]);
  });

  const lineshape = select(
    [
      ["Lorentz", "lorentz"],
      ["Voigt", "voigt"],
    ],
    settings.lineshape,
  );
  lineshape.title = "Lineshape of the fit";
  lineshape.addEventListener("change", () =>
    sendFit(v, "option", { name: "lineshape", value: lineshape.value }),
  );
  const gauss = fitOption(
    v,
    settings,
    "gauss_max_fwhm_hz",
    "Gauss max Hz",
    "Largest Gaussian width (FWHM) in Hz of a Voigt fit",
  );
  gauss.querySelector("input").disabled = settings.lineshape !== "voigt";

  const message = element("span", "hm-csi-mask-info", settings.message || "");
  const messageRow = element("div", "hm-csi-tool-row");
  messageRow.append(message);
  const run = button("Run fit", "Fit all voxels with the lines of the table");
  run.classList.add("hm-csi-primary");
  run.disabled = !peaks.length;
  run.addEventListener("click", () => {
    run.disabled = true;
    message.textContent = "Fitting all voxels ...";
    sendFit(v, "run");
  });

  const align = button(
    "Align spectra",
    "Shift every voxel spectrum to the weighted mean fitted frequency; fit again afterwards",
  );
  align.disabled = !settings.fitted;
  align.addEventListener("click", () => {
    align.disabled = true;
    message.textContent = "Aligning spectra ...";
    sendFit(v, "align");
  });
  const undoAlign = button("Undo align", "Show the spectra before alignment and their fit again");
  undoAlign.disabled = !settings.aligned;
  undoAlign.addEventListener("click", () => sendFit(v, "undo_align"));

  const refit = button(
    "Refit voxel",
    "Fit the selected voxel again with the start values and bounds of the table",
  );
  refit.disabled = !settings.fitted;
  refit.addEventListener("click", () => {
    refit.disabled = true;
    message.textContent = "Refitting the selected voxel ...";
    sendFit(v, "refit_voxel");
  });
  const nextProblem = button(
    "Next problem voxel",
    "Select the next voxel with a line at a bound or a poor fit (highest chi2/N first)",
  );
  nextProblem.disabled = !settings.fitted;
  nextProblem.addEventListener("click", () => sendFit(v, "next_problem"));
  v.fitResidualRange = v.fitResidualRange || [NaN, NaN];
  const residualInputs = [0, 1].map((side) =>
    fitNumber(
      v.fitResidualRange[side],
      5,
      side ? "Upper end in Hz of the search range" : "Lower end in Hz of the search range",
      (value) => {
        v.fitResidualRange[side] = value;
      },
    ),
  );
  const residual = button(
    "Line from residual",
    "Search the selected voxel's fit residual in the range for one more line; " +
      "it is added only when the data need it",
  );
  residual.disabled = !settings.fitted;
  residual.addEventListener("click", () => {
    const [low, high] = v.fitResidualRange;
    if (!Number.isFinite(low) || !Number.isFinite(high)) {
      message.textContent = "Type the search range in Hz first.";
      return;
    }
    message.textContent = "Searching the residual ...";
    sendFit(v, "residual_line", { low_hz: low, high_hz: high });
  });

  const earlier = settings.earlier_fit || "";
  const fromFit = button(
    "Use lines of earlier fit",
    earlier
      ? `Replace the table by the lines of the earlier fit (${earlier}); every voxel starts ` +
          "from its own fitted frequency and T2*"
      : "Needs an earlier fit: a fit stored on the scan or a fit run here",
  );
  fromFit.disabled = !earlier;
  fromFit.addEventListener("click", () => sendFit(v, "lines_from_fit"));
  const earlierInfo = element(
    "span",
    "hm-csi-mask-info",
    earlier ? `earlier fit: ${earlier}` : "no earlier fit yet",
  );

  return [
    settingsTable([
      [
        "New lines",
        "new",
        [
          fitOption(v, settings, "peak_height_snr", "height SNR", "Smallest peak height in noise units"),
          fitOption(v, settings, "max_peaks", "max lines", "Keep the strongest lines; 0 keeps all", 3),
          fitOption(v, settings, "freq_search_range_hz", "range Hz", "Smallest frequency search width in Hz"),
          fitOption(v, settings, "min_t2_ms", "T2* min ms", "Smallest T2* in ms of new lines"),
          fitOption(v, settings, "max_t2_ms", "max ms", "Largest T2* in ms of new lines"),
          detect,
          add,
          fromFit,
          earlierInfo,
          advanced,
        ],
      ],
      ...(v.fitAdvanced ? fitAdvancedRows(v, settings) : []),
    ]),
    ...(peaks.length ? [fitTable(v, peaks, v.fitAdvanced)] : []),
    settingsTable([
      ["Fit", "run", [labelled("lineshape", lineshape), gauss, fitOption(v, settings, "n_jobs", "workers", "Worker processes; -1 uses all CPU cores", 3), run, align, undoAlign]],
      [
        "Review",
        "run",
        [
          refit,
          nextProblem,
          labelled("residual Hz", residualInputs[0]),
          labelled("to", residualInputs[1]),
          residual,
        ],
      ],
      ["Save", "run", saveFitItems(v, "fit", settings.fitted)],
    ]),
    messageRow,
  ];
}

function onFitTool(v) {
  buildGroups(v, ["tool", "fit"]);
  showChosenTool(v);
}

// ---- browser/controls_curve_fit.js ----

// Control group "curve_fit": fit a relaxation or diffusion model along the
// curve axis in all voxels. The model follows the curve axis: ADC for
// b-values, T2 for echo times, T1 for inversion times. After the fit, the
// result map is the overlay "curve_fit" and the curve panel draws the fit
// and its residual for the selected voxel.
//
// Python owns model and settings (`_curve_fit_tool`, see
// hypermri.visualization.curve_fit_tool). Every input goes to Python as a
// `{type: "curve_fit"}` message; Python answers with a new `_curve_fit_tool`.

function sendCurveFit(v, action, content = {}) {
  v.model.send({ type: "curve_fit", action, ...content });
}

function curveFitControls(v) {
  const settings = v.model.get("_curve_fit_tool") || {};
  if (!settings.offered) return [];
  const message = element("span", "hm-csi-mask-info", settings.message || "");
  const messageRow = element("div", "hm-csi-tool-row");
  messageRow.append(message);

  const items = [
    element("span", "hm-csi-control-label", `${settings.label}, axis in ${settings.axis_unit}`),
  ];
  if (settings.model === "t1") {
    const baseline = fitCheckbox(
      settings.fit_baseline,
      "Fit a constant offset B besides the amplitude A",
      (value) => sendCurveFit(v, "option", { name: "fit_baseline", value }),
    );
    items.push(labelled("baseline", baseline));
  }
  const run = button(
    settings.fitted ? "Fit again" : "Run fit",
    `Fit all voxels; the map (${settings.result_unit}) becomes the overlay "curve_fit"`,
  );
  run.classList.add("hm-csi-primary");
  run.addEventListener("click", () => {
    run.disabled = true;
    message.textContent = "Fitting all voxels ...";
    sendCurveFit(v, "run");
  });
  items.push(run);
  return [
    settingsTable([
      ["Curve fit", "run", items],
      ["Save", "run", saveFitItems(v, "curve_fit", settings.fitted)],
    ]),
    messageRow,
  ];
}

function onCurveFitTool(v) {
  buildGroups(v, ["tool", "curve_fit"]);
  showChosenTool(v);
}

// ---- browser/controls_ideal.js ----

// Control group "ideal": separate chemical components (for example pyruvate
// and lactate) in complex multi-echo images with IDEAL, offered when the
// curve axis is the echoes (echo_idx). The user enters component names and
// frequencies in Hz; the echo spacing comes from the echo axis unless it is
// entered in ms. After the run, the overlay "ideal" holds one magnitude map
// per component and the field offset map in Hz.
//
// Python owns the settings and checks them (`_ideal_tool`, see
// hypermri.visualization.ideal_tool). Every input goes to Python as a
// `{type: "ideal"}` message; Python answers with a new `_ideal_tool`.

function sendIdeal(v, action, content = {}) {
  v.model.send({ type: "ideal", action, ...content });
}

// A text input that sends its text when it is changed.
function idealText(value, width, placeholder, title, onChange) {
  const input = element("input");
  input.type = "text";
  input.value = value || "";
  input.placeholder = placeholder;
  input.title = title;
  input.style.width = `${width}em`;
  input.addEventListener("change", () => onChange(input.value));
  return input;
}

function idealControls(v) {
  const settings = v.model.get("_ideal_tool") || {};
  if (!settings.offered) return [];
  const message = element("span", "hm-csi-mask-info", settings.message || "");
  if (!settings.complex) {
    message.textContent = "The shown echoes are real; IDEAL needs complex images.";
  }
  const messageRow = element("div", "hm-csi-tool-row");
  messageRow.append(message);
  const option = (name) => (value) => sendIdeal(v, "option", { name, value });

  const names = idealText(
    settings.component_names, 12, "pyruvate, lactate",
    "Names of the components, separated by commas; they name the maps",
    option("component_names"),
  );
  const frequencies = idealText(
    settings.frequencies_hz, 9, "0, 390",
    "Frequency of each component in Hz relative to the reference frequency, in the order of the names",
    option("frequencies_hz"),
  );
  const axis = settings.axis_spacing_ms;
  const spacing = idealText(
    settings.echo_spacing_ms == null ? "" : String(settings.echo_spacing_ms), 5,
    axis == null ? "needed" : `${Number(axis.toPrecision(4))} (axis)`,
    "Time between two echoes in ms; empty takes it from the echo axis",
    option("echo_spacing_ms"),
  );
  const offset = fitCheckbox(
    settings.fit_field_offset, "Fit the field offset (Hz) of each voxel",
    option("fit_field_offset"),
  );
  const theta = fitCheckbox(
    settings.fit_theta, "Fit the alternating-echo modulation Theta (bipolar read-out)",
    option("fit_theta"),
  );
  const run = button(
    settings.fitted ? "Fit again" : "Run IDEAL",
    `Separate the components in all voxels of the ${settings.n_echoes} echoes; the maps become the overlay "ideal"`,
  );
  run.classList.add("hm-csi-primary");
  run.addEventListener("click", () => {
    run.disabled = true;
    message.textContent = "Separating components in all voxels ...";
    sendIdeal(v, "run");
  });
  return [
    settingsTable([
      ["Components", "names", [labelled("names", names), labelled("Hz", frequencies)]],
      [
        "Fit",
        "run",
        [labelled("echo spacing ms", spacing), labelled("field offset", offset), labelled("Theta", theta), run],
      ],
      ["Save", "run", saveFitItems(v, "ideal", settings.fitted)],
    ]),
    messageRow,
  ];
}

function onIdealTool(v) {
  buildGroups(v, ["tool", "ideal"]);
  showChosenTool(v);
}

// ---- browser/controls_signal_decay.js ----

// Control group "signal_decay": decay of CSI raw data over the acquired
// k-space points (in acquisition order, not FID time), with a time-domain
// filter along these points, a spatial k-space filter and the signal end.
// Offered only in views opened by plot_signal_decay.
//
// A small plot below the inputs shows the decay curve of the unfiltered
// ("Original") and filtered data, the straight line fitted to the
// unfiltered curve from the signal end on ("Tail fit"), the signal end
// (red) and the suggested signal end (grey, dashed). A click on the plot
// sets the signal end. "Confirm" stores signal end and filter on the scan.
//
// Python owns the choices and computes the curves (`_signal_decay_tool`,
// see hypermri.visualization.signal_decay_tool). Every input goes to Python
// as a `{type: "signal_decay"}` message; Python answers with a new
// `_signal_decay_tool`, and with a new block when the filter changed.

function sendSignalDecay(v, action, content = {}) {
  v.model.send({ type: "signal_decay", action, ...content });
}

const DECAY_CURVE_CHOICES = [
  ["magnitude", "magnitude"],
  ["cumulative magnitude", "cumulative"],
  ["band power", "band_power"],
  ["cumulative band power", "cumulative_band_power"],
];
const SPATIAL_FILTER_CHOICES = [
  ["none", "none"],
  ["Gaussian", "gaussian"],
  ["Fermi", "fermi"],
];
const DECAY_CURVE_COLOURS = { Original: "#1f77b4", Filtered: "#ff7f0e", "Tail fit": "#7f7f7f" };

function signalDecayControls(v) {
  const settings = v.model.get("_signal_decay_tool") || {};
  if (!settings.offered) return [];
  const option = (name) => (value) => sendSignalDecay(v, "option", { name, value });
  const number = (name, label, title, width = 5) =>
    labelled(label, fitNumber(settings[name], width, title, option(name)));
  const choice = (name, options, title) => {
    const node = select(options, settings[name]);
    node.title = title;
    node.addEventListener("change", () => option(name)(node.value));
    return node;
  };
  const checkbox = (name, label, title) =>
    labelled(label, fitCheckbox(settings[name], title, option(name)));

  const last = settings.n_points - 1;
  const filterItems = [
    labelled("filter", choice("filter_type", settings.filter_types, "Time-domain filter along the acquired points")),
  ];
  if (settings.filter_type === "Exponential") {
    filterItems.push(number("decay_constant", "decay", "Exponential attenuation per acquired point (not Hz)"));
  }
  if (settings.filter_type === "Hamming") {
    filterItems.push(number("alpha", "alpha", "Hamming coefficient, normally 0 to 1", 4));
  }
  if (settings.filter_type === "Hamming" || settings.filter_type === "Hann") {
    filterItems.push(number("center_position", "centre", `Centre of the window in acquired points, 0 to ${last}`, 4));
  }
  filterItems.push(
    checkbox("remove_lowest_signal", "remove lowest", "Remove the lowest signal (filter_signal)"),
    checkbox("apply_flipangle_correction", "flip angle corr.", "Correct the signal loss of repeated excitations"),
  );
  if (settings.apply_flipangle_correction) {
    filterItems.push(number("flipangle_deg", "flip angle °", "Flip angle in degrees, 0 to 90", 4));
  }

  const spatialItems = [
    labelled("k-space", choice("spatial_filter", SPATIAL_FILTER_CHOICES, "Spatial filter of the k-space")),
  ];
  if (settings.spatial_filter === "gaussian") {
    spatialItems.push(number("sigma_per_mm", "sigma 1/mm", "Width of the Gaussian in cycles/mm"));
  }
  if (settings.spatial_filter === "fermi") {
    spatialItems.push(
      number("radius_per_mm", "radius 1/mm", "Radius of the Fermi filter in cycles/mm"),
      number("transition_per_mm", "edge 1/mm", "Edge width of the Fermi filter in cycles/mm"),
    );
  }

  const curveItems = [
    labelled("curve", choice("curve", DECAY_CURVE_CHOICES, "Decay curve over the acquired points")),
  ];
  if (settings.curve.includes("band_power")) {
    curveItems.push(
      labelled(
        "bands Hz",
        idealText(
          settings.bands_hz, 12, "whole spectrum",
          "Frequency bands as low:high in Hz, separated by commas, e.g. -330:-150, 200:420; empty is the whole spectrum",
          option("bands_hz"),
        ),
      ),
    );
  }
  curveItems.push(
    checkbox("show_tail", "tail fit", "Draw the line fitted to the unfiltered curve from the signal end on"),
    checkbox("subtract_tail", "subtract tail", "Subtract that line from the curves (display only)"),
    checkbox("show_filtered", "show filtered", "Show the data reconstructed with the filter in the map and spectrum"),
  );

  const end = number("signal_end", "signal end", `Kept acquired points (filter "None") and start of the tail fit, 0 to ${last}; or click the plot`, 5);
  const confirm = button("Confirm", "Store signal_end and filter_params on the scan; the acquired data are not changed");
  confirm.classList.add("hm-csi-primary");
  confirm.disabled = !settings.can_confirm;
  confirm.addEventListener("click", () => sendSignalDecay(v, "confirm"));

  const message = element("span", "hm-csi-mask-info", settings.curve_error || settings.message || "");
  const messageRow = element("div", "hm-csi-tool-row");
  messageRow.append(message);

  if (!v.decayPlot) {
    v.decayPlot = element("div", "hm-csi-decay-plot");
  }
  return [
    settingsTable([
      ["Filter", "options", filterItems],
      ["Spatial", "options", spatialItems],
      ["Curve", "detect", curveItems],
      ["Signal end", "run", [end, confirm]],
    ]),
    messageRow,
    v.decayPlot,
  ];
}

// Draw the decay curves into the plot of the tool. Called when the tool's
// inputs are built and once Plotly.js is loaded.
function drawSignalDecay(v) {
  const settings = v.model.get("_signal_decay_tool") || {};
  if (!v.Plotly || !v.decayPlot || !settings.offered) return;
  const curves = settings.curves || [];
  const x = curves.length ? curves[0].y.map((_, i) => i) : [];
  const traces = curves.map((curve) => ({
    type: "scatter",
    mode: "lines",
    name: curve.name,
    x,
    y: curve.y,
    line: { width: curve.name === "Tail fit" ? 1 : 1.5, color: DECAY_CURVE_COLOURS[curve.name], dash: curve.name === "Tail fit" ? "dot" : "solid" },
    hovertemplate: `${curve.name}: %{y:.4g} at point %{x}<extra></extra>`,
  }));
  const marker = (position, colour, dash) => ({
    type: "line",
    xref: "x",
    yref: "paper",
    x0: position,
    x1: position,
    y0: 0,
    y1: 1,
    line: { color: colour, width: 1.5, dash },
  });
  const shapes = [marker(settings.signal_end, "#d62728", "solid")];
  if (settings.suggested_end != null) shapes.push(marker(settings.suggested_end, "#555", "dash"));
  const layout = {
    height: 260,
    margin: { l: 60, r: 10, t: 10, b: 40 },
    xaxis: { title: { text: "acquired k-space point" } },
    yaxis: { title: { text: settings.y_label } },
    shapes,
    showlegend: true,
    legend: { orientation: "h", y: 1.12 },
    hovermode: "x",
  };
  v.Plotly.react(v.decayPlot, traces, layout, { displaylogo: false, responsive: true });
  if (!v.decayPlotClicks) {
    v.decayPlotClicks = true;
    v.decayPlot.on("plotly_click", (event) => {
      const point = event.points?.[0];
      if (!point) return;
      const value = Math.min(Math.max(Math.round(point.x), 0), settings.n_points - 1);
      sendSignalDecay(v, "option", { name: "signal_end", value });
    });
  }
}

function onSignalDecayTool(v) {
  buildGroups(v, ["tool", "signal_decay"]);
  showChosenTool(v);
  drawSignalDecay(v);
}

// ---- browser/controls_kspace.js ----

// Control group "kspace": shows the map and curves of the image or of its
// spatial k-space (along Read and Phase), optionally with a spatial filter
// (Gaussian or Fermi window in cycles/mm). Python computes the shown copy
// (ScanView.set_kspace) and answers with a new block; the data of the view
// are not changed. In k-space anatomy, overlays, masks and fits are off.
// The choices arrive as `view.kspace`; every input sends a
// `{type: "kspace"}` message.

function sendKspace(v, update) {
  v.model.send({ type: "kspace", ...update });
}

function kspaceControls(v) {
  const settings = v.view.kspace;
  if (!settings || !settings.available || v.view.single_voxel) return [];
  const space = select([["image", "image"], ["k-space", "kspace"]], settings.shown ? "kspace" : "image");
  space.title = "Show the image or its spatial k-space (Read and Phase, each slice on its own)";
  space.addEventListener("change", () => sendKspace(v, { shown: space.value === "kspace" }));
  const filter = select(SPATIAL_FILTER_CHOICES, settings.filter);
  filter.title = "Spatial filter of the k-space, applied to the image and the k-space shown";
  filter.addEventListener("change", () => sendKspace(v, { filter: filter.value }));
  const width = (name, label, title) =>
    labelled(label, fitNumber(settings[name], 5, title, (value) => sendKspace(v, { [name]: value })));
  const items = [labelled("show", space), labelled("filter", filter)];
  if (settings.filter === "gaussian") {
    items.push(width("sigma_per_mm", "sigma 1/mm", "Width of the Gaussian in cycles/mm"));
  }
  if (settings.filter === "fermi") {
    items.push(
      width("radius_per_mm", "radius 1/mm", "Radius of the Fermi filter in cycles/mm"),
      width("transition_per_mm", "edge 1/mm", "Edge width of the Fermi filter in cycles/mm"),
    );
  }
  if (settings.error) items.push(element("span", "hm-csi-mask-info", settings.error));
  return items;
}

// ---- browser/controls_tool.js ----

// Control group "tool": a menu that chooses which tool (plugin) shows its
// inputs. The tools are the control groups listed under `tools` in the
// layout (TOOLS in layout.py). Their inputs sit right after this menu and
// only the chosen one is visible. The choice is the synchronised `tool`
// trait (ScanView.tool), "" for none.

// Tools with nothing to offer for the shown data are left out of the menu:
// the mask tool of a view whose linked neighbour holds its inputs, and the
// fit tool for data that are not spectra and the curve fit for a curve axis
// without a model (b-values, echoes, inversion times), IDEAL unless the
// curve axis is the echoes, and the signal decay outside plot_signal_decay.
function availableTools(v) {
  const offered = {
    masks: !v.view.single_voxel && v.model.get("_mask_tool_shown"),
    fit: Boolean(v.model.get("_fit_tool")?.offered),
    curve_fit: Boolean(v.model.get("_curve_fit_tool")?.offered),
    ideal: Boolean(v.model.get("_ideal_tool")?.offered),
    signal_decay: Boolean(v.model.get("_signal_decay_tool")?.offered),
  };
  return v.layout.tools.filter((name) => offered[name] ?? true);
}

function toolControls(v) {
  const tools = availableTools(v);
  if (!tools.length) return [];
  const chosen = v.model.get("tool");
  const choice = select([["none", ""], ...tools], tools.includes(chosen) ? chosen : "");
  choice.title = "Show the inputs of one tool";
  choice.addEventListener("change", () => {
    v.model.set("tool", choice.value);
    v.model.save_changes();
  });
  return [labelled("tool", choice)];
}

// Show only the chosen tool's inputs. Leaving the masks stops drawing.
function showChosenTool(v) {
  const chosen = v.model.get("tool");
  for (const name of v.layout.tools) {
    if (v.groups[name]) v.groups[name].hidden = name !== chosen;
  }
  if (chosen !== "masks" && v.tool !== "off") {
    v.tool = "off";
    v.pending = [];
    buildMaskControls(v);
    if (v.Plotly) draw(v, { curve: false });
  }
  // The search ranges of the fit lines show only while the fit tool is open.
  if (v.Plotly) drawCurvePanel(v);
}

function onTool(v) {
  buildGroups(v, ["tool"]);
  showChosenTool(v);
}

// ---- browser/controls_time.js ----

// Control group "time_course": what the time panel shows. Empty when there
// is no time course.
//
// The spectral range is chosen by dragging in the spectrum or with the two
// inputs (in the displayed spectral unit); "follow point" shows the value at
// the selected spectral point again. "mask mean" adds the mean inside the
// chosen mask. All changes go to Python as a `{type: "time_course"}` message.

function sendTimeCourse(v, content) {
  v.model.send({ type: "time_course", ...content });
}

function timeCourseControls(v) {
  const time = v.view.time;
  const course = v.timeCourse;
  if (!time || !course.range) return [];
  const items = [element("span", "hm-csi-control-label", "Time course")];
  if (time.choices.length > 1) {
    const dim = select(time.choices, time.dim);
    dim.addEventListener("change", () => sendTimeCourse(v, { dim: dim.value }));
    items.push(labelled("along", dim));
  }
  const [first, last] = course.range_values;
  // The other limit is read when one changes; follow mode starts from the point.
  const lower = limitInput(v, first, (value) => {
    sendTimeCourse(v, { range: [value, upper.valueAsNumber] });
    return true;
  }, "Enter a number in the spectral unit.");
  const upper = limitInput(v, last, (value) => {
    sendTimeCourse(v, { range: [lower.valueAsNumber, value] });
    return true;
  }, "Enter a number in the spectral unit.");
  const unit = v.view.curve_label ? ` [${v.view.curve_label}]` : "";
  const follow = button("Follow point", "Show the value at the selected spectral point (double-click in the spectrum)");
  follow.disabled = course.follows_point;
  follow.addEventListener("click", () => sendTimeCourse(v, { range: null }));
  const maskBox = element("input");
  maskBox.type = "checkbox";
  maskBox.checked = Boolean(course.mask);
  maskBox.disabled = !v.activeMask;
  maskBox.title = "Add the mean time course inside the chosen mask (shown slice only)";
  maskBox.addEventListener("change", () =>
    sendTimeCourse(v, { mask: maskBox.checked ? v.activeMask : null }),
  );
  items.push(
    labelled(`from${unit}`, lower),
    labelled("to", upper),
    follow,
    labelled("mask mean", maskBox),
  );
  if (v.timeMessage) items.push(element("span", "hm-csi-mask-error", v.timeMessage));
  return items;
}

// ---- browser/controls_parameters.js ----

// Control group "parameters": the measurement parameters of the scan
// (`_parameters`, rows of hypermri.visualization.scan_parameters, sent once).
// "show parameters" opens a table grouped as the scan's PARAMETER_SCHEMA;
// typing in the filter keeps the rows whose name, group or value contains
// the text. Open state and filter are kept in the browser only, and the
// group is not rebuilt with a new block, so the filter survives.
// "original names" (shown while the table is open) adds the vendor's own
// name of each parameter (row.source, for example PVM_Matrix) after its name.

function parameterControls(v) {
  const rows = v.model.get("_parameters") || [];
  if (!rows.length) return [];
  const show = element("input");
  show.type = "checkbox";
  show.checked = Boolean(v.showParameters);
  show.title = "Show the measurement parameters of the scan (scan.get_parameters())";
  const filter = element("input");
  filter.type = "search";
  filter.placeholder = "filter";
  filter.value = v.parameterFilter || "";
  filter.size = 14;
  filter.hidden = !show.checked;
  filter.title = "Keep rows whose group, name or value contains this text";
  const original = element("input");
  original.type = "checkbox";
  original.checked = Boolean(v.showParameterSources);
  original.title = "Show the scanner's own name of each parameter, for example PVM_Matrix";
  const originalLabel = labelled("original names", original);
  originalLabel.hidden = !show.checked;
  const scroller = element("div", "hm-csi-parameter-scroll");
  scroller.hidden = !show.checked;

  const fill = () => {
    const needle = filter.value.trim().toLowerCase();
    const table = element("table", "hm-csi-parameter-table");
    let group = null;
    for (const row of rows) {
      const source = original.checked ? row.source || "" : "";
      const text = `${row.group} ${row.name} ${source} ${row.value}`.toLowerCase();
      if (needle && !text.includes(needle)) continue;
      if (row.group !== group) {
        group = row.group;
        const heading = element("tr", "hm-csi-parameter-group");
        const cell = element("th", "", group);
        cell.colSpan = 2;
        heading.append(cell);
        table.append(heading);
      }
      const line = element("tr");
      // Name and source each stay on one line; in a narrow view the source
      // moves below the name, so the value column stays in sight.
      const name = element("td", "hm-csi-parameter-name");
      name.append(element("span", "", row.name));
      if (source) name.append(" ", element("span", "hm-csi-parameter-source", source));
      line.append(name, element("td", "", row.value));
      table.append(line);
    }
    scroller.replaceChildren(table);
  };
  show.addEventListener("change", () => {
    v.showParameters = show.checked;
    filter.hidden = !show.checked;
    originalLabel.hidden = !show.checked;
    scroller.hidden = !show.checked;
  });
  original.addEventListener("change", () => {
    v.showParameterSources = original.checked;
    fill();
  });
  filter.addEventListener("input", () => {
    v.parameterFilter = filter.value;
    fill();
  });
  fill();
  // A label holds one control, so the three sit side by side in a span.
  const head = element("span", "hm-csi-parameter-head");
  head.append(labelled("show parameters", show), originalLabel, filter);
  return [head, scroller];
}

// ---- browser/time_panel.js ----

// Time panel: how the selected voxel changes along repetitions (or another
// dimension, `view.time.dim`), and optionally the mean inside a mask.
//
// Each point is the mean of the displayed spectrum over a spectral range
// (dragged in the curve panel), or its value at the selected spectral point.
// Python computes these means for every voxel and sends them in
// `_time_block` ([row][column][time], float32); the voxel curve therefore
// changes without asking Python. A red line marks the shown repetition;
// clicking a point shows that repetition in the map and spectrum.
//
// The panel is hidden when there is no time course (a single repetition, or
// a curve panel that does not show spectra).

function timeTitle(v) {
  const course = v.timeCourse;
  const [first, last] = course.range_values.map(formatPosition);
  const unit = v.view.curve_label;
  return course.follows_point
    ? `at ${first} ${unit}`
    : `mean over ${first} to ${last} ${unit}`;
}

function drawTimePanel(v) {
  const panel = v.panels.time;
  if (!panel) return;
  const time = v.view.time;
  const course = v.timeCourse;
  const shown = Boolean(time && course.range);
  panel.style.display = shown ? "" : "none";
  if (!shown) return;
  const view = v.view;
  const { row, column } = v.selection;
  const voxelName = `${view.row_dim} ${view.row_indices[row]}, ${view.column_dim} ${view.column_indices[column]}`;
  const traces = [
    {
      type: "scatter",
      mode: "lines+markers",
      x: time.x,
      y: timeValues(v, row, column),
      name: voxelName,
      line: { width: 1.3, color: "#1f77b4" },
      marker: { size: 5 },
      hovertemplate: `%{x:.4g} ${time.label}<br>%{y:.4g}<extra>voxel</extra>`,
    },
  ];
  if (course.mask_y) {
    traces.push({
      type: "scatter",
      mode: "lines+markers",
      x: time.x,
      y: course.mask_y,
      name: `mask ${course.mask}`,
      line: { width: 1.6, color: course.mask_color },
      marker: { size: 5 },
      hovertemplate: `%{x:.4g} ${time.label}<br>%{y:.4g}<extra>${course.mask}</extra>`,
    });
  }
  const position = time.x[time.index];
  v.Plotly.react(
    panel,
    traces,
    {
      title: { text: timeTitle(v), font: { size: 13 } },
      margin: { l: 60, r: 10, t: 30, b: 42 },
      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor: "rgba(0,0,0,0)",
      font: { color: textColour(v), size: 11 },
      hovermode: "closest",
      showlegend: true,
      legend: { orientation: "h", x: 0, y: 1.0, yanchor: "bottom", bgcolor: "rgba(0,0,0,0)" },
      xaxis: { title: { text: time.label }, showgrid: showGrid(v) },
      yaxis: {
        title: { text: view.value_label },
        zeroline: false,
        autorange: true,
        showgrid: showGrid(v),
      },
      shapes: [
        {
          type: "line",
          xref: "x",
          yref: "paper",
          x0: position,
          x1: position,
          y0: 0,
          y1: 1,
          line: { color: "#d62728", width: 1.5 },
        },
      ],
      uirevision: "time",
    },
    { displaylogo: false, responsive: true },
  );
}

function attachTimePanelEvents(v) {
  const panel = v.panels.time;
  if (!panel) return;
  panel.on("plotly_click", (event) => {
    const time = v.view.time;
    if (!time) return;
    const indices = { ...v.model.get("_controls").indices, [time.dim]: event.points[0].pointIndex };
    sendControls(v, { indices });
    v.el.focus({ preventScroll: true });
  });
}

// Python sent new time courses (new range, mask or mask edit).
function onTimeCourse(v) {
  readTimeCourse(v);
  buildGroups(v, ["time_course"]);
  if (v.Plotly) draw(v, { image: false });
}

// ---- browser/viewer.js ----

// Viewer: builds the page from the layout Python sends in `_layout`, keeps
// the selection, and connects Python messages, mouse and keyboard to the
// panels and control groups of the other parts.
//
// Everything that only changes which part of the block is shown (voxel,
// curve position, hover, crosshair, colour scaling) happens here without
// asking Python. Processing settings go back to Python through the
// `_controls` trait, which answers with a new block.

// Control group name (as in layout.py) -> function that builds its inputs.
const CONTROL_GROUP_BUILDERS = {
  slices: sliceControls,
  spectrum: spectrumControls,
  colour_range: colourRangeControls,
  curve_scale: curveScaleControls,
  display: displayControls,
  kspace: kspaceControls,
  save: saveControls,
  anatomy: anatomyControls,
  overlay: overlayControls,
  tool: toolControls,
  masks: maskControls,
  fit: fitControls,
  curve_fit: curveFitControls,
  ideal: idealControls,
  signal_decay: signalDecayControls,
  time_course: timeCourseControls,
  parameters: parameterControls,
};

// Panel name (as in layout.py) -> CSS class of its plot area.
const PANEL_CLASSES = { image: "hm-csi-map", curve: "hm-csi-spectrum", time: "hm-csi-time" };

// Control groups that only change what Python computes. In an HTML snapshot,
// which has no Python behind it, their inputs are shown but switched off.
const PYTHON_GROUPS = [
  "slices",
  "spectrum",
  "kspace",
  "save",
  "anatomy",
  "overlay",
  "tool",
  "masks",
  "fit",
  "curve_fit",
  "ideal",
  "signal_decay",
  "time_course",
];

function buildGroups(v, names) {
  for (const name of names) {
    const group = v.groups[name];
    if (!group) continue;
    group.replaceChildren(...CONTROL_GROUP_BUILDERS[name](v));
    if (v.isSnapshot && PYTHON_GROUPS.includes(name)) switchOffGroup(group);
  }
  hideEmptySections(v);
}

const NEEDS_PYTHON = "Needs Python: open the notebook with a running kernel to change this.";

function switchOffGroup(group) {
  group.classList.add("hm-csi-needs-python");
  group.title = NEEDS_PYTHON;
  for (const input of group.querySelectorAll("input, select, button, textarea")) {
    input.disabled = true;
  }
}

// Switch off one input of a browser-side group whose change Python answers
// (a colour scale, the scalebar length, the fit curves) in an HTML snapshot.
function needsPython(v, input) {
  if (!v.isSnapshot) return input;
  input.disabled = true;
  input.title = NEEDS_PYTHON;
  input.classList.add("hm-csi-needs-python");
  return input;
}

// A plot options section whose groups offer nothing for the shown data (no
// anatomy, no overlay, no time course) is hidden, and so is the button when
// no section is left.
function hideEmptySections(v) {
  for (const section of v.sections) {
    section.node.hidden = section.names.every((name) => !v.groups[name]?.childElementCount);
  }
  if (v.optionsToggle) {
    v.optionsToggle.hidden = v.sections.every((section) => section.node.hidden);
  }
}

// Rebuild every control group except the masks, which keep their own state,
// the tools, which change only with `_fit_tool`, `_curve_fit_tool`, `_ideal_tool` and
// `_signal_decay_tool` (so typing in the table
// survives a new block), the parameters, which never change, and the slices
// while one of their sliders is dragged.
function buildControls(v) {
  const kept = ["masks", "fit", "curve_fit", "ideal", "signal_decay", "parameters", ...(v.draggingSlice ? ["slices"] : [])];
  buildGroups(v, Object.keys(v.groups).filter((name) => !kept.includes(name)));
}

function buildMaskControls(v) {
  buildGroups(v, ["masks"]);
}

function updateStatus(v) {
  const parts = [];
  if (v.lastDrawMs !== null) parts.push(`browser redraw ${v.lastDrawMs.toFixed(1)} ms`);
  if (v.isSnapshot) {
    parts.push(`HTML snapshot without Python (${v.view.shape.join(" x ")})`);
  } else {
    parts.push(
      `last Python block ${v.view.compute_ms} ms (${v.view.block_megabytes} MB, ` +
        `${v.view.shape.join(" x ")})`,
    );
  }
  if (v.tool === "polygon") {
    parts.push("mask: click corners, Enter closes, Backspace removes, Esc cancels");
  } else if (v.tool === "freehand") {
    parts.push("mask: drag an outline on the map");
  } else {
    parts.push("click or arrow keys: voxel, , and . : curve position");
  }
  v.status.textContent = parts.join(" · ");
}

function draw(v, { image = true, curve = true, time = true } = {}) {
  const start = performance.now();
  if (image) drawImagePanel(v);
  if (curve) drawCurvePanel(v);
  if (time) drawTimePanel(v);
  sizeImagePanel(v);
  v.lastDrawMs = performance.now() - start;
  updateStatus(v);
}

function saveSelection(v) {
  clearTimeout(v.saveTimer);
  v.saveTimer = setTimeout(() => {
    v.model.set("selection", { ...v.selection });
    v.model.save_changes();
  }, 80);
}

// Select a voxel (row, column) and curve index k, clipped to the block.
function choose(v, { row = v.selection.row, column = v.selection.column, k = v.selection.curve_index }) {
  row = Math.min(Math.max(row, 0), nRows(v) - 1);
  column = Math.min(Math.max(column, 0), nColumns(v) - 1);
  k = Math.min(Math.max(k, 0), nCurve(v) - 1);
  const voxelChanged = row !== v.selection.row || column !== v.selection.column;
  const curveChanged = k !== v.selection.curve_index;
  if (!voxelChanged && !curveChanged) return;
  v.selection = { row, column, curve_index: k };
  draw(v);
  saveSelection(v);
}

// Set from Python, for example by a view linked with link_frames: show the
// new voxel and curve position from the block already here. The browser's
// own choice comes back here too and changes nothing.
function onSelection(v) {
  const s = v.model.get("selection");
  if (!s || !v.view.shape) return;
  const row = Math.min(Math.max(s.row, 0), nRows(v) - 1);
  const column = Math.min(Math.max(s.column, 0), nColumns(v) - 1);
  const k = Math.min(Math.max(s.curve_index, 0), nCurve(v) - 1);
  const same =
    row === v.selection.row && column === v.selection.column && k === v.selection.curve_index;
  if (same) return;
  v.selection = { row, column, curve_index: k };
  if (v.Plotly) draw(v);
}

function sendControls(v, update) {
  if (v.isSnapshot) {
    v.status.textContent = "This snapshot has no Python behind it; open the notebook to change this.";
    return;
  }
  const controls = structuredClone(v.model.get("_controls"));
  Object.assign(controls, update);
  v.requestSentAt = performance.now();
  v.status.textContent = "Python is preparing a new block ...";
  v.model.set("_controls", controls);
  v.model.save_changes();
}

function onNewBlock(v) {
  readBlock(v);
  v.cachedHoverIndices = hoverIndices(v);
  v.pending = [];
  buildControls(v);
  buildMaskControls(v);
  if (v.Plotly) draw(v);
  if (v.requestSentAt !== null) {
    const roundTrip = performance.now() - v.requestSentAt;
    v.requestSentAt = null;
    v.status.textContent += ` · settings round trip ${roundTrip.toFixed(0)} ms`;
  }
  sendWaitingSliceIndex(v);
}

function onCustomMessage(v, message) {
  if (message?.type === "settings_saved") {
    v.status.textContent = message.ok
      ? "View settings saved on the scan; the next plot_scan starts from them."
      : message.message;
    return;
  }
  if (message?.type === "time_course_error") {
    v.timeMessage = message.message;
    buildGroups(v, ["time_course"]);
    return;
  }
  if (message?.type !== "mask_error") return;
  v.maskMessage = message.message;
  buildMaskControls(v);
}

function onKey(v, event) {
  if (event.target.closest("input, select, button")) return;
  if (v.tool === "polygon" && v.pending.length) {
    const edits = {
      Enter: () => closeOutline(v),
      Escape: () => (v.pending = []),
      Backspace: () => v.pending.pop(),
    };
    if (edits[event.key]) {
      event.preventDefault();
      edits[event.key]();
      if (v.Plotly) drawImagePanel(v);
      return;
    }
  }
  // Arrow keys and , . move in the direction seen on screen, whatever the
  // axis orientation of the map or a reversed ppm axis.
  const view = v.view;
  const up = screenStep(view.y, view.y_range);
  const right = screenStep(view.x, view.x_range);
  const later = screenStep(view.curve_x, view.curve_invert_x ? [1, 0] : [0, 1]);
  const moves = {
    ArrowUp: { row: v.selection.row + up },
    ArrowDown: { row: v.selection.row - up },
    ArrowLeft: { column: v.selection.column - right },
    ArrowRight: { column: v.selection.column + right },
    ",": { k: v.selection.curve_index - later },
    ".": { k: v.selection.curve_index + later },
  };
  const move = moves[event.key];
  if (!move) return;
  event.preventDefault();
  choose(v, move);
}

// Place the control groups `names` in `parent`. The groups of the tools
// follow the "tool" menu.
function placeGroups(v, parent, names) {
  for (const name of names) {
    const groupNames = name === "tool" ? [name, ...v.layout.tools] : [name];
    for (const groupName of groupNames) {
      v.groups[groupName] = element("span", `hm-csi-group hm-csi-group-${groupName}`);
      parent.append(v.groups[groupName]);
    }
  }
}

// The page has three parts: a header (top bar and the collapsible plot
// options), the panels side by side, and a footer (controls below the plots
// and the status line). In a grid of views (plot_side_by_side) the three
// parts of every view line up in rows, so the plots of all views start and
// end at the same height.
function buildPage(v, layout) {
  const header = element("div", "hm-csi-header");
  const top = element("div", "hm-csi-bar hm-csi-top");
  placeGroups(v, top, layout.top_bar);
  const toggle = button("Plot options", "Show or hide the display and processing settings");
  toggle.classList.add("hm-csi-options-toggle");
  toggle.setAttribute("aria-expanded", "false");
  top.append(toggle);
  // The sections are rows of a table with a coloured title, as in the fit
  // tool; the colour class comes from the section title.
  const options = element("table", "hm-csi-fit-settings hm-csi-options");
  options.hidden = true;
  toggle.addEventListener("click", () => {
    options.hidden = !options.hidden;
    toggle.setAttribute("aria-expanded", String(!options.hidden));
  });
  for (const [title, names] of layout.option_sections) {
    const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-");
    const node = element("tr", `hm-csi-section hm-csi-section-${slug}`);
    const cell = element("td");
    const body = element("div", "hm-csi-fit-settings-items");
    placeGroups(v, body, names);
    cell.append(body);
    node.append(element("th", "", title), cell);
    options.append(node);
    v.sections.push({ node, names });
  }
  v.optionsToggle = toggle;
  // The name sits last in the header, right above the plots it names.
  v.nameLine = element("div", "hm-csi-name");
  showName(v);
  header.append(top, options, v.nameLine);

  const plots = element("div", "hm-csi-plots");
  for (const name of layout.panels) {
    v.panels[name] = element("div", PANEL_CLASSES[name]);
    plots.append(v.panels[name]);
  }

  const footer = element("div", "hm-csi-footer");
  if (layout.below_plots.length) {
    const below = element("div", "hm-csi-bar hm-csi-below");
    placeGroups(v, below, layout.below_plots);
    footer.append(below);
  }
  footer.append(v.status);
  v.el.append(header, plots, footer);
}

// The plot height is a CSS variable that the panels and sizeImagePanel read;
// the ResizeObserver then fits the Plotly plots to their new boxes.
function showPlotHeight(v) {
  v.el.style.setProperty("--hm-plot-height", `${v.model.get("plot_height")}px`);
  if (v.panels.image?._fullLayout) sizeImagePanel(v);
}

function showName(v) {
  const name = v.model.get("name");
  v.nameLine.textContent = name;
  v.nameLine.hidden = !name;
}

function render({ model, el }) {
  el.classList.add("hm-csi");
  el.tabIndex = 0;
  // Everything the parts share: data from Python, what the user chose, and
  // the HTML elements of the page.
  const v = {
    model,
    el,
    status: element("div", "hm-csi-status", "Loading Plotly.js ..."),
    panels: {},
    groups: {},
    sections: [],
    optionsToggle: null,
    nameLine: null,
    imageFit: null,
    Plotly: null,
    showAnatomy: true,
    anatomyOpacitySlider: null,
    overlayOpacitySlider: null,
    percentReference: "map",
    mapRangeInputs: null,
    requestSentAt: null,
    sliceRequest: null,
    draggingSlice: false,
    linkedPointer: null,
    lastDrawMs: null,
    saveTimer: null,
    tool: "off",
    erase: false,
    pending: [],
    outlineRevision: 0,
    maskMessage: "",
    fitAdvanced: false,
  };
  showPlotHeight(v);
  readBlock(v);
  v.activeMask = v.maskPlanes.length ? v.maskPlanes[v.maskPlanes.length - 1].name : "";
  v.cachedHoverIndices = hoverIndices(v);
  v.layout = model.get("_layout");
  v.isSnapshot = Boolean(v.layout.snapshot);
  buildPage(v, v.layout);

  const cleanups = [];
  const listeners = {
    "change:_view": onNewBlock,
    "change:_anatomy_opacity": onAnatomyOpacity,
    "change:_overlay_opacity": onOverlayOpacity,
    "change:_map_range": onMapRange,
    "change:_display": onDisplay,
    "change:_curve_axes": onCurveAxes,
    "change:_mask_planes": onMaskPlanes,
    "change:_mask_tool_shown": onMaskToolShown,
    "change:_fit_tool": onFitTool,
    "change:_curve_fit_tool": onCurveFitTool,
    "change:_ideal_tool": onIdealTool,
    "change:_signal_decay_tool": onSignalDecayTool,
    "change:_slice_lines": onSliceLines,
    "change:selection": onSelection,
    "change:_roi_mean": onRoiMean,
    "change:_fit_curves": onFitCurves,
    "change:_other_metabolite": onOtherMetabolite,
    "change:tool": onTool,
    "change:name": showName,
    "change:plot_height": showPlotHeight,
    "change:_time_course": onTimeCourse,
    "change:_time_block": onTimeCourse,
    "msg:custom": onCustomMessage,
  };
  for (const [name, listener] of Object.entries(listeners)) {
    const handler = (...args) => listener(v, ...args);
    model.on(name, handler);
    cleanups.push(() => model.off(name, handler));
  }
  const pointerHandler = (event) => onLinkedPointer(v, event);
  POINTER_EVENTS.addEventListener("pointer", pointerHandler);
  cleanups.push(() => POINTER_EVENTS.removeEventListener("pointer", pointerHandler));
  const maskToolHandler = (event) => onLinkedMaskTool(v, event);
  MASK_EVENTS.addEventListener("masktool", maskToolHandler);
  cleanups.push(() => MASK_EVENTS.removeEventListener("masktool", maskToolHandler));
  const closeOutlineHandler = (event) => onLinkedCloseOutline(v, event);
  MASK_EVENTS.addEventListener("closeoutline", closeOutlineHandler);
  cleanups.push(() => MASK_EVENTS.removeEventListener("closeoutline", closeOutlineHandler));
  const keyHandler = (event) => onKey(v, event);
  el.addEventListener("keydown", keyHandler);
  cleanups.push(() => el.removeEventListener("keydown", keyHandler));
  buildControls(v);
  buildGroups(v, ["masks", "fit", "curve_fit", "ideal", "signal_decay", "parameters"]);
  showChosenTool(v);

  loadPlotly(model, (note) => {
    v.status.textContent = note;
  })
    .then((plotly) => {
      v.Plotly = plotly;
      // Every panel becomes a Plotly plot, even one hidden at the start
      // (image only, single voxel, no time course), so that its events can
      // be attached now and work once a new block shows it.
      for (const panel of Object.values(v.panels)) {
        plotly.newPlot(panel, [], {}, { displaylogo: false, responsive: true });
      }
      draw(v);
      drawSignalDecay(v);
      attachImagePanelEvents(v);
      attachCurvePanelEvents(v);
      attachTimePanelEvents(v);
      // Plotly sizes a plot once when it is drawn. A panel that had no width
      // yet (output not attached, hidden time panel) or that wraps to a new
      // row is fitted to its box again whenever that box changes.
      const resizer = new ResizeObserver((entries) => {
        for (const entry of entries) {
          if (entry.target._fullLayout && entry.contentRect.width > 0) {
            if (entry.target === v.panels.image) sizeImagePanel(v);
            const resized = plotly.Plots.resize(entry.target);
            if (entry.target === v.panels.image) resized.then(() => fitColourBars(v));
          }
        }
      });
      for (const panel of Object.values(v.panels)) resizer.observe(panel);
      cleanups.push(() => resizer.disconnect());
    })
    .catch((error) => {
      v.status.textContent = `Could not load Plotly.js: ${error}`;
    });

  return () => {
    clearTimeout(v.saveTimer);
    for (const cleanup of cleanups) cleanup();
    if (v.Plotly) {
      for (const panel of Object.values(v.panels)) v.Plotly.purge(panel);
      if (v.decayPlot) v.Plotly.purge(v.decayPlot);
    }
  };
}

export default { render };

// Start of an HTML snapshot (ScanView.to_html): a stand-in for the widget
// model that serves the values saved from Python and keeps the browser's own
// changes (voxel, curve position, colour range) on the page. Nothing is sent
// anywhere. This file is appended to the viewer parts only in a snapshot.

function decodeBytes(text) {
  const binary = atob(text);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
  return bytes;
}

function snapshotModel(state) {
  const values = {};
  for (const [name, value] of Object.entries(state)) {
    values[name] = value && typeof value === "object" && "base64" in value ? decodeBytes(value.base64) : value;
  }
  const listeners = new Map();
  return {
    get: (name) => values[name],
    set(name, value) {
      values[name] = value;
      for (const listener of [...(listeners.get(`change:${name}`) ?? [])]) listener();
    },
    save_changes() {},
    send() {},
    on(name, listener) {
      if (!listeners.has(name)) listeners.set(name, new Set());
      listeners.get(name).add(listener);
    },
    off(name, listener) {
      listeners.get(name)?.delete(listener);
    },
  };
}

render({
  model: snapshotModel(JSON.parse(document.getElementById("hypermri-state").textContent)),
  el: document.getElementById("hypermri-view"),
});

</script>
</body>
