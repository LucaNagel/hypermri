/* Look of the browser viewer (hypermri.visualization.scan_view.ScanView).
   Which panels and control groups appear, and where, is set in layout.py.
   Colours come from the notebook theme where it defines them, with
   neutral fallbacks that read in light and dark themes. */

.hm-csi {
  --hm-border: var(--jp-border-color2, rgba(128, 128, 128, 0.3));
  --hm-input-border: rgba(128, 128, 128, 0.45);
  --hm-surface: rgba(128, 128, 128, 0.07);
  --hm-accent: var(--jp-brand-color1, #1f77b4);
  --hm-plot-height: 400px;
  font-family: var(--jp-ui-font-family, system-ui, sans-serif);
  font-size: 12px;
  outline: none;
  width: 100%;
  box-sizing: border-box;
  /* Header, plots and footer; inside a grid of views (plot_side_by_side)
     they take the rows of that grid, so the plots of all views line up. */
  display: grid;
  grid-template-rows: subgrid;
  grid-row: span 3;
  grid-template-columns: minmax(0, 1fr);
  align-content: start;
}

.hm-csi:focus-visible {
  box-shadow: 0 0 0 2px var(--hm-accent);
}

/* ---- inputs ---- */

.hm-csi input[type="number"],
.hm-csi input[type="text"],
.hm-csi select {
  font: inherit;
  padding: 1px 4px;
  border: 1px solid var(--hm-input-border);
  border-radius: 4px;
  min-height: 20px;
  box-sizing: border-box;
}

.hm-csi input[type="number"] {
  width: 5em;
}

.hm-csi input[type="checkbox"] {
  margin: 0;
  accent-color: var(--hm-accent);
}

.hm-csi input[type="range"] {
  accent-color: var(--hm-accent);
}

.hm-csi-button {
  font: inherit;
  padding: 2px 10px;
  border: 1px solid var(--hm-input-border);
  border-radius: 4px;
  background: var(--hm-surface);
  color: inherit;
  cursor: pointer;
  white-space: nowrap;
}

.hm-csi-button:hover:not(:disabled) {
  border-color: var(--hm-accent);
}

.hm-csi-button:disabled {
  opacity: 0.45;
  cursor: default;
}

.hm-csi-button.hm-csi-primary {
  background: var(--hm-accent);
  border-color: var(--hm-accent);
  color: white;
}

.hm-csi-control {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.hm-csi-control-label {
  opacity: 0.7;
}

.hm-csi-value {
  min-width: 2ch;
  font-variant-numeric: tabular-nums;
}

/* ---- rows of controls ---- */

.hm-csi-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
}

/* A control group only names its inputs; they flow inside the row. */
.hm-csi-group {
  display: contents;
}

/* A tool that is not chosen in the "tool" menu, or an empty section. */
.hm-csi-group[hidden],
.hm-csi-section[hidden],
.hm-csi-options[hidden],
.hm-csi-button[hidden] {
  display: none !important;
}

/* ---- header: top bar and plot options ---- */

.hm-csi-header {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px 0;
  min-width: 0;
}

.hm-csi-top {
  min-height: 24px;
}

.hm-csi-options-toggle {
  margin-left: auto;
}

.hm-csi-options-toggle::before {
  content: "▸ ";
}

.hm-csi-options-toggle[aria-expanded="true"]::before {
  content: "▾ ";
}

.hm-csi-options-toggle[aria-expanded="true"] {
  border-color: var(--hm-accent);
}

/* Plot options: a table like the fit settings (.hm-csi-fit-settings), one
   row per section with a coloured title. */
.hm-csi-options th {
  width: 7.5em;
  background: var(--hm-border);
}

.hm-csi-section-spectrum th { background: var(--hm-fit-freq); }
.hm-csi-section-map th { background: var(--hm-fit-run); }
.hm-csi-section-anatomy th { background: var(--hm-fit-new); }
.hm-csi-section-overlay th { background: var(--hm-fit-options); }
.hm-csi-section-time-course th { background: var(--hm-fit-detect); }

/* Colour range slider with its value. */
.hm-csi-range-slider {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.hm-csi-range-slider input[type="range"] {
  width: 9em;
}

.hm-csi-range-value {
  min-width: 5.5em;
  font-variant-numeric: tabular-nums;
}

/* Name of the shown scan, right above its plots. Its length does not widen
   a grid column that fits its content (plot_side_by_side); it wraps. */
.hm-csi-name {
  font-size: 13px;
  font-weight: 600;
  contain: inline-size;
  overflow-wrap: anywhere;
}

.hm-csi-name[hidden] {
  display: none;
}

/* ---- plots ---- */

.hm-csi-plots {
  display: flex;
  flex-wrap: wrap;
  /* A map lowered by sizeImagePanel stays level with the curves' x axes. */
  align-items: flex-end;
  /* Side by side, a view without curves gets the plot row height of its
     neighbours; its image stays at the top, level with their images, and
     their curves fill the space below it. */
  align-content: flex-start;
  gap: 4px;
  min-width: 0;
}

.hm-csi-map,
.hm-csi-spectrum,
.hm-csi-time {
  height: var(--hm-plot-height);
  min-width: 0;
}

/* sizeImagePanel sets the width at which the map fills the height; next to
   a curve the map takes at most 60 % of the row. */
.hm-csi-map {
  flex: 0 1 360px;
  max-width: 60%;
}

.hm-csi-map.hm-csi-map-alone {
  flex: 1 1 auto;
  max-width: 100%;
}

.hm-csi-spectrum {
  flex: 1 1 300px;
}

.hm-csi-time {
  flex: 1 1 300px;
}

/* ---- footer: tools and status ---- */

/* Tools and status wrap within the width of the plots instead of widening
   a grid column that fits its content. */
.hm-csi-footer {
  contain: inline-size;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 4px 0 6px;
  min-width: 0;
}

.hm-csi-below {
  border-top: 1px solid var(--hm-border);
  padding-top: 8px;
}

/* A control group of an HTML snapshot that needs Python to change. */
.hm-csi-needs-python {
  opacity: 0.45;
}

.hm-csi-status {
  font-size: 11px;
  opacity: 0.55;
  font-variant-numeric: tabular-nums;
}

/* A titled line of a tool, on its own row below the "tool" menu. */
.hm-csi-tool-row {
  flex-basis: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
}

.hm-csi-tool-row-title {
  font-weight: 600;
  min-width: 6.5em;
  opacity: 0.8;
}

.hm-csi-group-masks input[type="color"] {
  width: 2.2em;
  height: 1.6em;
  padding: 0;
  border: none;
  background: none;
}

.hm-csi-group-masks input[type="range"] {
  width: 6em;
}

/* The peak table of the fit tool takes a line of its own. */
.hm-csi-fit-table-scroll {
  flex-basis: 100%;
  overflow-x: auto;
  border: 1px solid var(--hm-border);
  border-radius: 6px;
}

.hm-csi-fit-table {
  border-collapse: collapse;
  font-size: 0.95em;
}

.hm-csi-fit-table th {
  font-weight: 600;
  opacity: 0.7;
  text-align: left;
  padding: 4px 4px 2px;
  white-space: nowrap;
  background: var(--hm-surface);
}

.hm-csi-fit-table td {
  padding: 2px 4px;
}

.hm-csi-fit-table tr + tr td {
  border-top: 1px solid var(--hm-border);
}

/* Fit tool: settings as a table with a coloured title per group, and the
   peak table with tinted column groups. Translucent tints suit light and
   dark notebooks alike. */
.hm-csi {
  --hm-fit-new: rgba(44, 160, 44, 0.16);
  --hm-fit-detect: rgba(255, 127, 14, 0.16);
  --hm-fit-options: rgba(148, 103, 189, 0.16);
  --hm-fit-run: rgba(31, 119, 180, 0.16);
  --hm-fit-freq: rgba(23, 190, 207, 0.1);
  --hm-fit-t2: rgba(255, 127, 14, 0.1);
  --hm-fit-seed: rgba(44, 160, 44, 0.1);
  --hm-fit-coupling: rgba(148, 103, 189, 0.1);
}

.hm-csi-fit-settings {
  flex-basis: 100%;
  border-collapse: separate;
  border-spacing: 0 3px;
}

.hm-csi-fit-settings th {
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
  padding: 3px 10px;
  border-radius: 6px 0 0 6px;
  width: 6.5em;
}

.hm-csi-fit-settings td {
  padding: 3px 8px;
  border-radius: 0 6px 6px 0;
  background: var(--hm-surface);
}

.hm-csi-fit-settings-items {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
}

.hm-csi-fit-kind-new th { background: var(--hm-fit-new); }
.hm-csi-fit-kind-detect th { background: var(--hm-fit-detect); }
.hm-csi-fit-kind-options th { background: var(--hm-fit-options); }
.hm-csi-fit-kind-run th { background: var(--hm-fit-run); }

.hm-csi-fit-table .hm-csi-fit-col-freq { background: var(--hm-fit-freq); }
.hm-csi-fit-table .hm-csi-fit-col-t2 { background: var(--hm-fit-t2); }
.hm-csi-fit-table .hm-csi-fit-col-seed { background: var(--hm-fit-seed); }
.hm-csi-fit-table .hm-csi-fit-col-coupling { background: var(--hm-fit-coupling); }

.hm-csi-fit-groups th {
  text-align: center;
  opacity: 0.85;
}

.hm-csi-fit-swatch {
  width: 6px;
  padding: 0 !important;
}

.hm-csi-fit-off td {
  opacity: 0.5;
}

.hm-csi-mask-info {
  font-variant-numeric: tabular-nums;
  opacity: 0.8;
}

.hm-csi-mask-error {
  color: var(--jp-error-color1, #d62728);
}

/* Measurement parameters below the plots. */
.hm-csi-parameter-scroll {
  flex-basis: 100%;
  max-height: 320px;
  overflow: auto;
  border: 1px solid var(--hm-border);
  border-radius: 6px;
}

.hm-csi-parameter-table {
  border-collapse: collapse;
  font-size: 0.95em;
  width: 100%;
}

.hm-csi-parameter-table td {
  padding: 2px 8px;
  vertical-align: top;
  font-variant-numeric: tabular-nums;
}

.hm-csi-parameter-name {
  opacity: 0.8;
}

.hm-csi-parameter-name > span {
  white-space: nowrap;
}

.hm-csi-parameter-head {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
}

/* The label's own display would otherwise override the hidden attribute. */
.hm-csi-parameter-head [hidden] {
  display: none;
}

/* Scanner name of a parameter after the canonical name. */
.hm-csi-parameter-source {
  font-family: var(--jp-code-font-family, monospace);
  font-size: 0.9em;
  opacity: 0.7;
}

.hm-csi-parameter-group th {
  position: sticky;
  top: 0;
  text-align: left;
  font-weight: 600;
  padding: 4px 8px 2px;
  background: var(--hm-fit-run);
  backdrop-filter: blur(4px);
}

/* Decay curves of the signal-decay tool, below its inputs. */
.hm-csi-decay-plot {
  flex-basis: 100%;
  min-width: 320px;
  max-width: 720px;
}

<script type="module">
// ---- browser/helpers.js ----

// Small helpers shared by all parts: loading Plotly.js, reading the binary
// arrays Python sends, and building HTML inputs.

const PLOTLY_PROMISE_KEY = "__hypermriScanViewPlotly";

// How long the browser waits for Python to send Plotly.js before it falls
// back to the public package (a notebook opened without a running kernel).
const PLOTLY_KERNEL_WAIT_MS = 5000;

// Plotly.js comes from the first source that has it: a page that already
// loaded it (the HTML snapshot), the running Python kernel, which sends the
// copy of the installed plotly package, or, when Python has not answered
// within PLOTLY_KERNEL_WAIT_MS (a notebook opened without a kernel), the same
// version from the public npm package. A late answer from Python still
// counts. `onNote` receives a line for the status bar while it waits.
function loadPlotly(model, onNote = () => {}) {
  if (globalThis.Plotly?.newPlot) return Promise.resolve(globalThis.Plotly);
  if (!globalThis[PLOTLY_PROMISE_KEY]) {
    globalThis[PLOTLY_PROMISE_KEY] = new Promise((resolve) => {
      const onMessage = (message, buffers) => {
        if (message?.type !== "plotly") return;
        clearTimeout(timer);
        model.off("msg:custom", onMessage);
        const source = new TextDecoder().decode(buffers[0]);
        const module = { exports: {} };
        new Function("module", "exports", source)(module, module.exports);
        resolve(module.exports);
      };
      const fromPackage = () => {
        onNote("Python does not answer; loading Plotly.js from the web ...");
        plotlyFromPackage(model.get("_plotly_version")).then(resolve, (error) =>
          onNote(`Waiting for Python to send Plotly.js (web copy failed: ${error.message})`),
        );
      };
      const timer = setTimeout(fromPackage, PLOTLY_KERNEL_WAIT_MS);
      model.on("msg:custom", onMessage);
      try {
        model.send({ type: "request_plotly" });
      } catch {
        clearTimeout(timer);
        fromPackage();
      }
    });
  }
  return globalThis[PLOTLY_PROMISE_KEY];
}

async function plotlyFromPackage(version) {
  if (!version) throw new Error("the Plotly.js version is unknown");
  const module = await import(`https://cdn.jsdelivr.net/npm/plotly.js-dist-min@${version}/+esm`);
  return module.default ?? module;
}

function readFloat32(model, name) {
  const bytes = model.get(name);
  const start = bytes.byteOffset;
  return new Float32Array(bytes.buffer.slice(start, start + bytes.byteLength));
}

// Rows of an anatomy or overlay plane for Plotly; missing values (NaN) become gaps.
function layerRows(model, name, layer) {
  if (!layer?.shape) return null;
  const values = readFloat32(model, name);
  const [rows, columns] = layer.shape;
  const z = [];
  for (let row = 0; row < rows; row += 1) {
    const line = new Array(columns);
    for (let column = 0; column < columns; column += 1) {
      const value = values[row * columns + column];
      line[column] = Number.isFinite(value) ? value : null;
    }
    z.push(line);
  }
  return z;
}

function finiteRange(values) {
  let low = Infinity;
  let high = -Infinity;
  for (const value of values) {
    if (Number.isFinite(value)) {
      if (value < low) low = value;
      if (value > high) high = value;
    }
  }
  if (low === Infinity) return [0, 1];
  if (low === high) return [low - 0.5, high + 0.5];
  return [low, high];
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function labelled(text, control) {
  const wrapper = element("label", "hm-csi-control");
  wrapper.append(element("span", "hm-csi-control-label", text), control);
  return wrapper;
}

// Options are values, or [label, value] pairs when the shown text differs.
function select(options, value) {
  const node = element("select");
  for (const option of options) {
    const [label, optionValue] = Array.isArray(option) ? option : [option, option];
    const item = element("option", "", label);
    item.value = optionValue;
    node.append(item);
  }
  node.value = value;
  return node;
}

function hexToRgba(hex, alpha) {
  const value = parseInt(hex.slice(1), 16);
  return `rgba(${(value >> 16) & 255},${(value >> 8) & 255},${value & 255},${alpha})`;
}

function parsePath(path) {
  const numbers = (path.match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi) || []).map(Number);
  const points = [];
  for (let i = 0; i + 1 < numbers.length; i += 2) points.push([numbers[i], numbers[i + 1]]);
  return points;
}

function button(text, title) {
  const node = element("button", "hm-csi-button", text);
  node.type = "button";
  if (title) node.title = title;
  return node;
}

// +1 when the next index lies further right (x) or higher up (y) on screen.
function screenStep(centres, range) {
  if (centres.length < 2) return 1;
  const along = Math.sign(centres[1] - centres[0]) * Math.sign(range[range.length - 1] - range[0]);
  return along < 0 ? -1 : 1;
}

// A number input for a colour limit. accept(value) returns false for a
// limit that does not lie on the right side of the other one, which is
// then reverted.
// `hint` is shown in the status line when the entry is refused.
function limitInput(v, value, accept, hint = "Enter a number; the colour minimum must be below the maximum.") {
  const input = element("input");
  input.type = "number";
  input.step = "any";
  input.style.width = "7em";
  const show = (number) => (input.value = number == null ? "" : Number(Number(number).toPrecision(6)));
  show(value);
  input.addEventListener("change", () => {
    const number = Number(input.value);
    if (input.value !== "" && Number.isFinite(number) && accept(number)) return;
    v.status.textContent = hint;
    show(value);
  });
  input.show = (number) => {
    value = number;
    show(number);
  };
  return input;
}

// A 0-1 slider for an opacity.
function opacitySlider(value, title) {
  const slider = element("input");
  slider.type = "range";
  slider.min = 0;
  slider.max = 1;
  slider.step = 0.05;
  slider.value = value;
  if (title) slider.title = title;
  return slider;
}

// ---- browser/block.js ----

// What Python sends and how to read it.
//
// Python sends one float32 block with the processed curves of every voxel in
// the displayed plane, laid out as [row][column][curve] (C order), plus a
// view description in `_view` (axes, labels, colours, option lists).
// Anatomy (under the map) and overlay (above it) arrive as float32 planes in
// `_anatomy` and `_overlay`. Mask coverage arrives in `_mask_planes`, the mean
// curve inside a mask in `_roi_mean`, the fitted spectrum of the selected
// voxel in `_fit_curves` and, with the metabolites split, the curve of the
// other metabolite at the selected voxel in `_other_metabolite`. The curve is
// a spectrum or runs along another dimension (`view.curve_dim`), for example
// repetitions. With
// spectra and several repetitions, `_time_block` holds every voxel's time
// course ([row][column][time]) and `_time_course` the chosen spectral range
// and the mask time course. While repetitions are averaged (or channels
// combined) along the curve, `_map_plane` holds the processed map
// ([row][column]) and the curves keep every entry (`view.map_fixed`).
//
// All parts share one object `v` ("viewer") that holds this data, the current
// selection and the HTML elements; readBlock fills its data fields.

function readBlock(v) {
  const model = v.model;
  v.view = model.get("_view");
  v.block = readFloat32(model, "_block");
  v.mapPlane = v.view.map_fixed ? readFloat32(model, "_map_plane") : null;
  v.anatomyZ = layerRows(model, "_anatomy", v.view.anatomy);
  v.overlayZ = layerRows(model, "_overlay", v.view.overlay);
  v.maskPlanes = model.get("_mask_planes") || [];
  v.roiMean = model.get("_roi_mean") || {};
  v.fitCurves = model.get("_fit_curves") || {};
  v.otherMetabolite = model.get("_other_metabolite") || {};
  v.selection = { ...model.get("selection") };
  readTimeCourse(v);
}

function readTimeCourse(v) {
  v.timeBlock = readFloat32(v.model, "_time_block");
  v.timeCourse = v.model.get("_time_course") || {};
  v.timeMessage = "";
}

const nRows = (v) => v.view.shape[0];
const nColumns = (v) => v.view.shape[1];
const nCurve = (v) => v.view.shape[2];

// Map of the plane at curve index k, as rows of values; the processed map
// when it does not follow the curve position.
function planeValues(v, k) {
  const z = [];
  for (let row = 0; row < nRows(v); row += 1) {
    const line = new Array(nColumns(v));
    for (let column = 0; column < nColumns(v); column += 1) {
      const voxel = row * nColumns(v) + column;
      line[column] = v.mapPlane ? v.mapPlane[voxel] : v.block[voxel * nCurve(v) + k];
    }
    z.push(line);
  }
  return z;
}

// Curve (spectrum or other) of one voxel.
function curveValues(v, row, column) {
  const start = (row * nColumns(v) + column) * nCurve(v);
  return Array.from(v.block.subarray(start, start + nCurve(v)));
}

// Time course of one voxel; empty while block and view do not match yet.
function timeValues(v, row, column) {
  const n = v.view.time ? v.view.time.x.length : 0;
  if (v.timeBlock.length !== nRows(v) * nColumns(v) * n) return [];
  const start = (row * nColumns(v) + column) * n;
  return Array.from(v.timeBlock.subarray(start, start + n));
}

// Finite range of every value in the plane, computed by Python.
function planeRange(v) {
  return v.view.plane_range;
}

// ---- browser/image_panel.js ----

// Image panel: the map of the displayed plane at the chosen curve position.
//
// Drawn from bottom to top: anatomy, CSI map, overlay, masks. A crosshair and
// a box mark the selected voxel. Clicking selects a voxel, or adds a polygon
// corner while the polygon mask tool is on.

// Colour limits of the map from state.spatial, as _apply_spatial_clim in
// render_data.py: percentages are fractions of the finite range of the
// reference, the other range modes are limits in signal units.
// Curve position for the title: whole numbers (indices) without decimals.
function formatPosition(value) {
  return Number.isInteger(value) ? String(value) : value.toPrecision(4);
}

function mapColourLimits(v, z, settings = v.model.get("_map_range")) {
  if (settings.range_mode !== "Percentage") return [settings.vmin, settings.vmax];
  const [low, high] = v.percentReference === "map" ? finiteRange(z.flat()) : planeRange(v);
  const span = high - low;
  return [low + (settings.vmin / 100) * span, low + (settings.vmax / 100) * span];
}

function textColour(v) {
  return getComputedStyle(v.el).color || "#333";
}

// Scalebar from Python (ScanView.set_display) as a line and a label, placed
// as in plot: 5 % from the side and 6 % of the height towards the centre.
// The ranges run from the bottom to the top of the screen.
function scalebarTraces(v) {
  const bar = v.view.scalebar;
  if (!bar) return [];
  const [left, right] = [Math.min(...v.view.x_range), Math.max(...v.view.x_range)];
  const [bottom, top] = v.view.y_range;
  const height = top - bottom;
  const length = Math.min(bar.length, right - left);
  const pad = (right - left) * 0.05;
  const x0 = bar.location.includes("left") ? left + pad : right - pad - length;
  const upper = bar.location.includes("upper");
  const y = upper ? top - height * 0.06 : bottom + height * 0.06;
  const textY = upper ? y - height * 0.04 : y + height * 0.04;
  const common = { type: "scatter", hoverinfo: "skip", showlegend: false, cliponaxis: false };
  return [
    { ...common, mode: "lines", x: [x0, x0 + length], y: [y, y], line: { color: bar.color, width: 4 }, name: "scalebar" },
    {
      ...common,
      mode: "text",
      x: [x0 + length / 2],
      y: [textY],
      text: [bar.label],
      textfont: { color: bar.color, size: bar.fontsize },
      name: "scalebar label",
    },
  ];
}

// With "min -> NaN" voxels below the colour minimum are not drawn.
function hideBelowMinimum(z, zmin) {
  return z.map((line) => line.map((value) => (value < zmin ? null : value)));
}

// Hover text per voxel: source indices and the coverage of every mask.
function hoverIndices(v) {
  return v.view.row_indices.map((rowIndex, row) =>
    v.view.column_indices.map((columnIndex, column) => {
      let text = "";
      for (const mask of v.maskPlanes) {
        const value = mask.plane?.[row]?.[column] ?? 0;
        if (value > 0) text += `<br>${mask.name} ${(value * 100).toFixed(0)} %`;
      }
      return [rowIndex, columnIndex, text];
    }),
  );
}

function anatomyShown(v) {
  return Boolean(v.anatomyZ) && v.showAnatomy;
}

// Drawn first, fully opaque and without hover, under the CSI map (as in plot).
function anatomyTraces(v) {
  if (!anatomyShown(v)) return [];
  const layer = v.view.anatomy;
  return [
    {
      type: "heatmap",
      z: v.anatomyZ,
      x: layer.x,
      y: layer.y,
      zmin: layer.zmin ?? undefined,
      zmax: layer.zmax ?? undefined,
      colorscale: layer.colorscale,
      zsmooth: layer.zsmooth,
      showscale: false,
      hoverinfo: "skip",
      name: "anatomy",
    },
  ];
}

// Drawn above the CSI map without hover, so clicks still select CSI voxels.
function overlayTraces(v) {
  if (!v.overlayZ) return [];
  const layer = v.view.overlay;
  return [
    {
      type: "heatmap",
      z: v.overlayZ,
      x: layer.x,
      y: layer.y,
      zmin: layer.zmin ?? undefined,
      zmax: layer.zmax ?? undefined,
      colorscale: layer.colorscale,
      opacity: v.model.get("_overlay_opacity"),
      hoverinfo: "skip",
      name: "overlay",
      colorbar: {
        ...colourBarPlace(v, v.model.get("_display").show_colorbar ? 1 : 0),
        title: { text: layer.label, side: "right" },
      },
    },
  ];
}

function maskTraces(v) {
  return v.maskPlanes
    .filter((mask) => mask.plane)
    .map((mask) => ({
      type: "heatmap",
      z: mask.plane.map((line) => line.map((value) => (value > 0 ? value : null))),
      x: v.view.x,
      y: v.view.y,
      zmin: 0,
      zmax: 1,
      colorscale: [
        // Partly covered edge voxels stay visible: coverage 0+ starts at 35 % colour.
        [0, hexToRgba(mask.color, 0.35)],
        [1, hexToRgba(mask.color, 1)],
      ],
      opacity: mask.alpha,
      showscale: false,
      hoverinfo: "skip",
      name: mask.name,
    }));
}

// Where the shown slices of other views cross this image
// (ScanView.show_slices_of): a semi-transparent band with a solid edge.
// "skip" lets clicks through to the map, so masks can be drawn under it.
function sliceLineTraces(v) {
  if (v.model.get("_display").show_slice_lines !== true) return [];
  return (v.model.get("_slice_lines") || []).map((line) => ({
    type: "scatter",
    mode: "lines",
    x: line.x,
    y: line.y,
    fill: "toself",
    fillcolor: hexToRgba(line.colour, 0.25),
    line: { color: line.colour, width: 1.5 },
    hoverinfo: "skip",
    showlegend: false,
    name: line.name,
  }));
}

// Set from Python when a linked view shows another slice. The display
// controls offer the switch for the bands only while there are bands.
function onSliceLines(v) {
  buildGroups(v, ["display"]);
  if (v.Plotly) drawImagePanel(v);
}

// Mouse pointer shared by linked views (ScanView.link_pointer). The views of
// one page talk over this event target, without Python: each sends the LPS
// position under its mouse, and the others mark it with a ring at shapes[0].
const POINTER_EVENTS = (globalThis.hypermriPointerEvents ??= new EventTarget());

function dot(a, b) {
  return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
}

// _pointer_plane: LPS = origin_mm + x * x_step_mm + y * y_step_mm (mm).
function axesToLps(plane, x, y) {
  return [0, 1, 2].map((i) => plane.origin_mm[i] + x * plane.x_step_mm[i] + y * plane.y_step_mm[i]);
}

// The point of the plane closest to an LPS position, in plot axes, and how
// far the position lies from the plane.
function lpsToAxes(plane, point) {
  const d = point.map((value, i) => value - plane.origin_mm[i]);
  const a = plane.x_step_mm;
  const b = plane.y_step_mm;
  const [aa, bb, ab, da, db] = [dot(a, a), dot(b, b), dot(a, b), dot(d, a), dot(d, b)];
  const det = aa * bb - ab * ab;
  let x = 0;
  let y = 0;
  if (det > 1e-9 * aa * bb && det > 0) {
    x = (da * bb - db * ab) / det;
    y = (db * aa - da * ab) / det;
  } else if (aa > 0) {
    x = da / aa;
  } else if (bb > 0) {
    y = db / bb;
  }
  const away = d.map((value, i) => value - x * a[i] - y * b[i]);
  return { x, y, distance: Math.sqrt(dot(away, away)) };
}

function inRange(value, range) {
  return value >= Math.min(...range) && value <= Math.max(...range);
}

function sendPointer(v, lps) {
  const link = v.model.get("_pointer_link");
  if (!link) return;
  POINTER_EVENTS.dispatchEvent(new CustomEvent("pointer", { detail: { link, source: v, lps } }));
}

function onLinkedPointer(v, event) {
  const { link, source, lps } = event.detail;
  if (source === v || !link || link !== v.model.get("_pointer_link")) return;
  const plane = v.model.get("_pointer_plane");
  v.linkedPointer = lps && plane?.origin_mm ? lpsToAxes(plane, lps) : null;
  const panel = v.panels.image;
  if (v.Plotly && panel?._fullLayout && panel.style.display !== "none") {
    // Single attributes: a whole object at "shapes[0]" would insert a shape.
    const update = {};
    for (const [key, value] of Object.entries(linkedPointerShape(v))) {
      update[`shapes[0].${key}`] = value;
    }
    v.Plotly.relayout(panel, update);
  }
}

// A filled ring inside the shown slice, an open ring in front of or behind it.
function linkedPointerShape(v) {
  const point = v.linkedPointer;
  const view = v.view;
  if (!point || !inRange(point.x, view.x_range) || !inRange(point.y, view.y_range)) {
    return { type: "circle", visible: false, x0: 0, x1: 0, y0: 0, y1: 0, fillcolor: "rgba(0,0,0,0)" };
  }
  const span = Math.max(
    Math.abs(view.x_range[1] - view.x_range[0]),
    Math.abs(view.y_range[1] - view.y_range[0]),
  );
  const r = 0.02 * span;
  const thickness = v.model.get("_pointer_plane").thickness_mm || 0;
  const inside = point.distance <= Math.max(thickness / 2, 1e-3);
  return {
    type: "circle",
    visible: true,
    x0: point.x - r,
    x1: point.x + r,
    y0: point.y - r,
    y1: point.y + r,
    line: { color: "#ffffff", width: 2 },
    fillcolor: inside ? "rgba(255,255,255,0.6)" : "rgba(0,0,0,0)",
  };
}

// Mouse moves are sent at most once per frame.
function attachPointerEvents(v, panel) {
  let frame = null;
  let lastEvent = null;
  const send = () => {
    frame = null;
    const plane = v.model.get("_pointer_plane");
    const layout = panel._fullLayout;
    if (!plane?.origin_mm || !layout?.xaxis?.p2d || v.view.single_voxel) return;
    const box = panel.getBoundingClientRect();
    const x = layout.xaxis.p2d(lastEvent.clientX - box.left - layout.xaxis._offset);
    const y = layout.yaxis.p2d(lastEvent.clientY - box.top - layout.yaxis._offset);
    const inside = inRange(x, layout.xaxis.range) && inRange(y, layout.yaxis.range);
    sendPointer(v, inside ? axesToLps(plane, x, y) : null);
  };
  panel.addEventListener("mousemove", (event) => {
    lastEvent = event;
    frame ??= requestAnimationFrame(send);
  });
  panel.addEventListener("mouseleave", () => sendPointer(v, null));
}

function outlineColour(v) {
  if (v.erase) return "#ffffff";
  return v.maskPlanes.find((mask) => mask.name === v.activeMask)?.color || "#ff0000";
}

// The polygon being clicked, as a dashed outline.
function pendingShape(v) {
  if (!v.pending.length) return [];
  const path =
    v.pending.map(([x, y], i) => `${i ? "L" : "M"}${x},${y}`).join(" ") +
    (v.pending.length > 2 ? " Z" : "");
  return [
    {
      type: "path",
      path,
      line: { color: outlineColour(v), width: 2, dash: "dash" },
    },
  ];
}

// Horizontal room of one colour bar with its tick labels and title.
const COLOUR_BAR_STEP_PX = 62;

// Names of the image traces that show a colour bar, left to right.
function colourBarTraces(v) {
  return [
    ...(v.model.get("_display").show_colorbar ? ["csi"] : []),
    ...(v.overlayZ ? ["overlay"] : []),
  ];
}

// Colour bar number `index` (0 next to the map) placed right of the map and
// as tall as it. Plotly places colour bars in fractions of the plot area,
// but an equal-scale map can fill less than that area, so the place comes
// from the map's domain in the last drawn layout; fitColourBars corrects it
// once the new layout is known.
function colourBarPlace(v, index) {
  const full = v.panels.image?._fullLayout;
  const xDomain = full?.xaxis?.domain ?? [0, 1];
  const yDomain = full?.yaxis?.domain ?? [0, 1];
  const width = full?._size?.w || 300;
  return {
    thickness: 12,
    xanchor: "left",
    x: xDomain[1] + (8 + index * COLOUR_BAR_STEP_PX) / width,
    yanchor: "middle",
    y: (yDomain[0] + yDomain[1]) / 2,
    len: yDomain[1] - yDomain[0],
  };
}

// Move the colour bars next to the map after Plotly has fitted the map into
// the panel (a draw or a resize); nothing is redrawn when they are in place.
function fitColourBars(v) {
  const panel = v.panels.image;
  if (!v.Plotly || !panel?._fullLayout?.xaxis || !Array.isArray(panel.data)) return;
  const names = colourBarTraces(v);
  const update = { "colorbar.x": [], "colorbar.y": [], "colorbar.len": [] };
  const indices = [];
  panel.data.forEach((trace, i) => {
    const index = names.indexOf(trace.name);
    if (index < 0 || !trace.colorbar) return;
    const place = colourBarPlace(v, index);
    const moved = ["x", "y", "len"].some(
      (key) => Math.abs((trace.colorbar[key] ?? 0) - place[key]) > 1e-3,
    );
    if (!moved) return;
    indices.push(i);
    update["colorbar.x"].push(place.x);
    update["colorbar.y"].push(place.y);
    update["colorbar.len"].push(place.len);
  });
  if (indices.length) v.Plotly.restyle(panel, update, indices);
}

// Keep what fixes the shape of the map (axis ranges at equal scale, margins)
// for sizeImagePanel; returns the margins for the Plotly layout.
function rememberImageFit(v, xRange, yRange, margin) {
  v.imageFit = { xRange, yRange, margin };
  return margin;
}

// Margins of the map: the axis tick labels and the title, no axis titles
// (the axes are named in the tooltip and by the slice sliders).
const IMAGE_MARGIN = { l: 40, r: 10, t: 30, b: 24 };

// Give the map panel the width at which the map fills the plot height, so
// that no empty band remains above and below it; the curve and time panels
// share the rest. Alone in its row, the panel takes the whole width. When
// the row leaves less width than that, the panel becomes lower instead, so
// that a wide map leaves no empty band above it either.
function sizeImagePanel(v) {
  const panel = v.panels.image;
  if (!panel || !v.imageFit || panel.style.display === "none") return;
  const { xRange, yRange, margin } = v.imageFit;
  const spanX = Math.abs(xRange[xRange.length - 1] - xRange[0]);
  const spanY = Math.abs(yRange[yRange.length - 1] - yRange[0]);
  if (!(spanX > 0 && spanY > 0)) return;
  const fullHeight =
    parseFloat(getComputedStyle(panel).getPropertyValue("--hm-plot-height")) || 400;
  const plotHeight = fullHeight - margin.t - margin.b;
  const width = Math.round((plotHeight * spanX) / spanY + margin.l + margin.r);
  const alone = Object.entries(v.panels).every(
    ([name, other]) => name === "image" || other.style.display === "none",
  );
  panel.classList.toggle("hm-csi-map-alone", alone);
  // Alone, the width is a preference: the panel grows into a wider column
  // and gives a grid column that fits its content (plot_side_by_side) the
  // width of the image.
  panel.style.flexBasis = alone ? "" : `${Math.max(width, 200)}px`;
  panel.style.width = alone ? `${Math.max(width, 200)}px` : "";
  const given = panel.clientWidth;
  const lower =
    given > 0 && given < width - 1
      ? Math.round(((given - margin.l - margin.r) * spanY) / spanX + margin.t + margin.b)
      : fullHeight;
  panel.style.height = `${Math.min(Math.max(lower, 160), fullHeight)}px`;
}

// Single voxel or slab with an anatomy: the anatomy slice and, on it, the cut
// of the excited volume as a closed line. Nothing here can be clicked.
function drawOutlinePanel(v) {
  const panel = v.panels.image;
  const outline = v.view.outline;
  const shape = outline.kind === "slab" ? "slab" : "voxel";
  v.Plotly.react(
    panel,
    [
      ...anatomyTraces(v),
      {
        type: "scatter",
        mode: "lines",
        x: outline.x,
        y: outline.y,
        line: { color: "#ff3b30", width: 2 },
        hoverinfo: "skip",
        name: shape,
      },
    ],
    {
      title: {
        text:
          `${shape} on anatomy` +
          (outline.slice_dim ? ` ${outline.slice_dim} ${outline.slice_index}` : ""),
        font: { size: 13 },
      },
      showlegend: false,
      margin: rememberImageFit(v, outline.x_range, outline.y_range, { ...IMAGE_MARGIN }),
      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor: "rgba(0,0,0,0)",
      font: { color: textColour(v), size: 11 },
      xaxis: { range: outline.x_range, constrain: "domain" },
      yaxis: {
        range: outline.y_range,
        scaleanchor: "x",
        scaleratio: 1,
        constrain: "domain",
        constraintoward: "bottom",
      },
      shapes: [],
      dragmode: "zoom",
      uirevision: "outline",
    },
    { displaylogo: false, responsive: true },
  );
}

function drawImagePanel(v) {
  const panel = v.panels.image;
  if (!panel) return;
  // A single voxel has no map; with an anatomy it shows the voxel outline.
  const outlined = Boolean(v.view.outline?.kind);
  panel.style.display = v.view.single_voxel && !outlined ? "none" : "";
  if (v.view.single_voxel) {
    if (outlined) drawOutlinePanel(v);
    return;
  }
  const view = v.view;
  const { row, column, curve_index: k } = v.selection;
  const display = v.model.get("_display");
  const values = planeValues(v, k);
  const [zmin, zmax] = mapColourLimits(v, values);
  const z = display.min_to_nan ? hideBelowMinimum(values, zmin) : values;
  const x = view.x[column];
  const y = view.y[row];
  const dx = view.x.length > 1 ? Math.abs(view.x[1] - view.x[0]) / 2 : 0.5;
  const dy = view.y.length > 1 ? Math.abs(view.y[1] - view.y[0]) / 2 : 0.5;
  const line = { color: "white", width: 1, dash: "dot" };
  const curvePosition = view.curve_x[k];
  v.Plotly.react(
    panel,
    [
      ...anatomyTraces(v),
      {
        type: "heatmap",
        name: "csi",
        z,
        x: view.x,
        y: view.y,
        zmin,
        zmax,
        opacity: anatomyShown(v) ? v.model.get("_anatomy_opacity") : 1,
        colorscale: view.colorscale,
        zsmooth: display.smoothing === "off" ? false : display.smoothing,
        customdata: v.cachedHoverIndices,
        // The value of voxels hidden by "min -> NaN" too.
        text: values,
        // "none" (not "skip") keeps the click events that select a voxel.
        // A hovertemplate would show a label even with "none", so it is
        // only set while tooltips are on.
        hoverinfo: display.show_tooltips ? undefined : "none",
        hovertemplate: display.show_tooltips
          ? `${view.column_dim} %{customdata[1]}, ${view.row_dim} %{customdata[0]}` +
            "<br>x %{x:.4g}, y %{y:.4g}<br>value %{text:.4g}%{customdata[2]}<extra></extra>"
          : undefined,
        showscale: Boolean(display.show_colorbar),
        colorbar: colourBarPlace(v, 0),
      },
      ...overlayTraces(v),
      ...(display.show_masks === false ? [] : maskTraces(v)),
      ...sliceLineTraces(v),
      ...scalebarTraces(v),
    ],
    {
      title: {
        text:
          view.curve_dim === null || view.map_fixed
            ? view.title || ""
            : `${view.title || ""} at ${formatPosition(curvePosition)} ${view.curve_label}`,
        font: { size: 13 },
      },
      margin: rememberImageFit(v, view.x_range, view.y_range, {
        ...IMAGE_MARGIN,
        r: IMAGE_MARGIN.r + COLOUR_BAR_STEP_PX * colourBarTraces(v).length,
      }),
      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor: "rgba(0,0,0,0)",
      font: { color: textColour(v), size: 11 },
      xaxis: {
        range: view.x_range,
        constrain: "domain",
        showgrid: display.show_grid_lines,
        // Above the map; below it the grid would only show in empty voxels.
        layer: "above traces",
      },
      yaxis: {
        range: view.y_range,
        scaleanchor: "x",
        scaleratio: 1,
        constrain: "domain",
        // A map narrower than the panel sits on the bottom, level with the
        // x axis of the curve panel beside it.
        constraintoward: "bottom",
        showgrid: display.show_grid_lines,
        layer: "above traces",
      },
      shapes: [
        linkedPointerShape(v),
        ...(display.show_crosshair
          ? [
              { type: "line", xref: "x", yref: "paper", x0: x, x1: x, y0: 0, y1: 1, line },
              { type: "line", xref: "paper", yref: "y", x0: 0, x1: 1, y0: y, y1: y, line },
            ]
          : []),
        {
          type: "rect",
          x0: x - dx,
          x1: x + dx,
          y0: y - dy,
          y1: y + dy,
          line: { color: "white", width: 2 },
        },
        ...pendingShape(v),
      ],
      dragmode: v.tool === "freehand" ? "drawclosedpath" : "zoom",
      newshape: {
        line: { color: outlineColour(v), width: 2, dash: "dash" },
        fillcolor: "rgba(0,0,0,0)",
      },
      uirevision: "map",
      // Plotly keeps drawn shapes as user state; a new revision drops a committed outline.
      editrevision: v.outlineRevision,
    },
    { displaylogo: false, responsive: true },
  ).then(() => fitColourBars(v));
}

// The polygon corner is where the user clicked, not the voxel centre, so outlines can
// cut voxels partly. Falls back to the voxel centre if Plotly gives no mouse event.
function clickedDataPoint(v, mouse, row, column) {
  const layout = v.panels.image._fullLayout;
  if (!mouse || !layout?.xaxis?.p2d) return [v.view.x[column], v.view.y[row]];
  const box = v.panels.image.getBoundingClientRect();
  return [
    layout.xaxis.p2d(mouse.clientX - box.left - layout.xaxis._offset),
    layout.yaxis.p2d(mouse.clientY - box.top - layout.yaxis._offset),
  ];
}

function attachImagePanelEvents(v) {
  const panel = v.panels.image;
  if (!panel) return;
  attachPointerEvents(v, panel);
  panel.on("plotly_click", (event) => {
    const point = event.points.find((item) => item.data.name === "csi");
    if (!point) return;
    const [row, column] = point.pointIndex;
    if (v.tool === "polygon") {
      v.pending.push(clickedDataPoint(v, event.event, row, column));
      drawImagePanel(v);
    } else {
      choose(v, { row, column });
    }
    v.el.focus({ preventScroll: true });
  });
  panel.on("plotly_relayout", (event) => {
    if (v.tool !== "freehand" || !event.shapes) return;
    const drawn = event.shapes.filter((shape) => shape.type === "path").pop();
    v.outlineRevision += 1;
    drawImagePanel(v);
    if (drawn) commitOutline(v, parsePath(drawn.path));
  });
}

// ---- browser/curve_panel.js ----

// Curve panel: the curve of the selected voxel (its spectrum, or for example
// its time course over repetitions), or the means inside a mask when "ROI
// mean" is on. A red line marks the curve position shown in the image
// panel; clicking the curve moves it. The panel is hidden for an image
// without a curve dimension (image only). With fit results, the fitted
// spectrum of the selected voxel (`_fit_curves`, computed by Python as in
// plot) is drawn over the measured one.
//
// With a time panel, dragging along the spectrum chooses the spectral range
// averaged for the time course (shown as a red band); a double-click returns
// to the value at the selected point.
//
// While the map shows averaged repetitions, the curve keeps every repetition
// and a red band marks the averaged ones (as in plot); the map does not follow
// a curve position, so no position line is drawn.

// "ROI mean": the mean of the shown curves (for example the spectra in the
// chosen part and unit) and of the fitted spectra over the mask voxels of the
// shown plane, drawn like the voxel curve. The mean magnitude of the supplied
// samples over the whole mask (for FID data the mean FID) has its own axes at
// the top and right, as its axis is the acquisition axis.
function drawRoiMean(v) {
  const roiMean = v.roiMean;
  const view = v.view;
  const colour = v.maskPlanes.find((m) => m.name === roiMean.mask)?.color || "#1f77b4";
  const traces = [];
  if (roiMean.shown) {
    traces.push({
      type: "scatter",
      mode: "lines",
      name: `mean in ${roiMean.mask}, shown slice`,
      x: view.curve_x,
      y: roiMean.shown,
      line: { width: 1.3, color: "#1f77b4" },
      hovertemplate: `%{x:.4g} ${view.curve_label}<br>%{y:.4g}<extra></extra>`,
    });
  }
  for (const fit of roiMean.fits || []) {
    traces.push({
      type: "scatter",
      mode: "lines",
      name: fit.name,
      x: roiMean.fit_x,
      y: fit.y,
      line: { width: 1.3, color: fit.color },
      hovertemplate: `${fit.name}: %{y:.4g}<extra></extra>`,
    });
  }
  const own = traces.length === 0;
  traces.push({
    type: "scatter",
    mode: "lines",
    name: `mean magnitude in ${roiMean.mask}, supplied samples`,
    x: roiMean.x,
    y: roiMean.y,
    xaxis: own ? "x" : "x2",
    yaxis: own ? "y" : "y2",
    line: { width: 1, color: own ? colour : "#8c8c8c" },
    hovertemplate: `%{x:.4g} ${roiMean.x_label}<br>%{y:.4g}<extra></extra>`,
  });
  const rawX = {
    title: { text: roiMean.x_label },
    autorange: roiMean.invert_x ? "reversed" : true,
    showgrid: showGrid(v),
  };
  const rawY = {
    title: { text: roiMean.y_label },
    zeroline: false,
    autorange: true,
    showgrid: showGrid(v),
  };
  const layout = {
    // With the top axis, the legend names the mask instead of a title.
    title: own
      ? { text: `ROI mean magnitude: ${roiMean.mask}`, font: { size: 13 } }
      : undefined,
    margin: { l: 60, r: own ? 10 : 60, t: own ? 36 : 50, b: 45 },
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(0,0,0,0)",
    font: { color: textColour(v), size: 11 },
    hovermode: "x",
    showlegend: !own,
    legend: { orientation: "h", y: -0.25, yanchor: "top", x: 0, xanchor: "left" },
    uirevision: "roi-mean",
  };
  if (own) {
    layout.xaxis = rawX;
    layout.yaxis = rawY;
  } else {
    layout.xaxis = {
      title: { text: view.curve_label },
      autorange: view.curve_invert_x ? "reversed" : true,
      showgrid: showGrid(v),
    };
    layout.yaxis = {
      title: { text: view.value_label },
      zeroline: false,
      autorange: true,
      showgrid: showGrid(v),
    };
    layout.xaxis2 = { ...rawX, overlaying: "x", side: "top", showgrid: false };
    layout.yaxis2 = { ...rawY, overlaying: "y", side: "right", showgrid: false };
  }
  v.Plotly.react(v.panels.curve, traces, layout, { displaylogo: false, responsive: true });
}

// Fitted curves of the selected voxel, and the residual below them; none
// while Python still computes them for a newly selected voxel. A curve with
// its own `x` (the residual zero line) is drawn on that axis.
function fitTraces(v, row, column) {
  const fit = v.fitCurves;
  if (!fit.curves || fit.row !== row || fit.column !== column) return [];
  return fit.curves.map((curve) => ({
    type: "scatter",
    mode: "lines",
    name: curve.name,
    x: curve.x || fit.x,
    y: curve.y,
    line: { width: curve.dash ? 1 : 1.3, color: curve.color, dash: curve.dash || "solid" },
    hovertemplate: `${curve.name}: %{y:.4g}<extra></extra>`,
  }));
}

// While the fit tool is open: the frequency search range of every table
// line as a band in the line's colour (fitLineColour), in the shown unit.
function searchBandShapes(v) {
  if (v.model.get("tool") !== "fit" || !v.view.spectroscopic) return [];
  const controls = v.model.get("_controls");
  if (controls.processing?.show_fid) return [];
  const settings = v.model.get("_fit_tool") || {};
  const peaks = settings.peaks || [];
  return (settings.search_bands || []).flatMap((band, row) => {
    const limits = band[controls.spec_unit];
    if (!limits || peaks[row]?.fit === false) return [];
    return [
      {
        type: "rect",
        xref: "x",
        yref: "paper",
        x0: limits[0],
        x1: limits[1],
        y0: 0,
        y1: 1,
        fillcolor: fitLineColour(row),
        opacity: 0.13,
        line: { width: 0 },
        layer: "below",
      },
    ];
  });
}

// With the interleaved metabolites split, the curve of the metabolite the
// slider does not select at the same voxel (`_other_metabolite`, as in plot).
function otherMetaboliteTraces(v, row, column) {
  const other = v.otherMetabolite;
  if (!other.y || other.row !== row || other.column !== column) return [];
  return [
    {
      type: "scatter",
      mode: "lines",
      name: other.name,
      x: v.view.curve_x,
      y: other.y,
      line: { width: 1.3, color: "#2ca02c", dash: "dot" },
      hovertemplate: `${other.name}: %{y:.4g}<extra></extra>`,
    },
  ];
}

function onOtherMetabolite(v) {
  v.otherMetabolite = v.model.get("_other_metabolite") || {};
  if (v.Plotly) drawCurvePanel(v);
}

function onFitCurves(v) {
  v.fitCurves = v.model.get("_fit_curves") || {};
  if (v.Plotly) drawCurvePanel(v);
}

function drawCurvePanel(v) {
  const panel = v.panels.curve;
  if (!panel) return;
  const shown = v.view.curve_dim !== null;
  panel.style.display = shown ? "" : "none";
  if (!shown) return;
  if (v.roiMean.mask) {
    drawRoiMean(v);
    return;
  }
  const view = v.view;
  const { row, column, curve_index: k } = v.selection;
  const position = view.curve_x[k];
  const course = v.timeCourse;
  const band = (x0, x1) => ({
    type: "rect",
    xref: "x",
    yref: "paper",
    x0,
    x1,
    y0: 0,
    y1: 1,
    fillcolor: "rgba(214, 39, 40, 0.12)",
    line: { width: 0 },
    layer: "below",
  });
  const rangeShapes = [];
  if (view.time && course.range && !course.follows_point) {
    rangeShapes.push(band(course.range_values[0], course.range_values[1]));
  }
  if (view.average_range) rangeShapes.push(band(...view.average_range));
  const positionLine = view.map_fixed
    ? []
    : [
        {
          type: "line",
          xref: "x",
          yref: "paper",
          x0: position,
          x1: position,
          y0: 0,
          y1: 1,
          line: { color: "#d62728", width: 1.5 },
        },
      ];
  const traces = [
    {
      type: "scatter",
      mode: "lines",
      x: view.curve_x,
      y: curveValues(v, row, column),
      // Next to the other metabolite, name the one the slider selects.
      name: v.otherMetabolite.y
        ? `metabolite_idx ${v.model.get("_controls").indices?.metabolite_idx ?? 0}`
        : "data",
      line: { width: 1.3, color: "#1f77b4" },
      hovertemplate: `%{x:.4g} ${view.curve_label}<br>%{y:.4g}<extra></extra>`,
    },
    ...fitTraces(v, row, column),
    ...otherMetaboliteTraces(v, row, column),
  ];
  const axes = curveAxes(v, traces);
  v.Plotly.react(
    v.panels.curve,
    traces,
    {
      title: {
        text: view.single_voxel
          ? "single voxel"
          : `${view.row_dim} ${view.row_indices[row]}, ` +
            `${view.column_dim} ${view.column_indices[column]}`,
        font: { size: 13 },
        // On the left, so that the legend on the right never covers it.
        x: 0,
        xref: "paper",
        xanchor: "left",
      },
      margin: { l: 60, r: 10, t: 30, b: 42 },
      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor: "rgba(0,0,0,0)",
      font: { color: textColour(v), size: 11 },
      hovermode: "x",
      showlegend: v.fitCurves.curves !== undefined || v.otherMetabolite.y !== undefined,
      legend: { orientation: "h", y: 1.0, yanchor: "bottom", x: 1, xanchor: "right" },
      xaxis: { title: { text: view.curve_label }, showgrid: showGrid(v), ...axes.xaxis },
      yaxis: {
        title: { text: view.value_label },
        zeroline: false,
        showgrid: showGrid(v),
        ...axes.yaxis,
      },
      shapes: [
        ...positionLine,
        ...rangeShapes,
        ...searchBandShapes(v),
      ],
      // Dragging chooses the time course range; the drawn box is not kept.
      dragmode: view.time ? "select" : "zoom",
      selectdirection: "h",
      selections: [],
      // A new window or curve scale replaces a zoom made with the mouse.
      uirevision: `curve ${JSON.stringify(v.model.get("_curve_axes"))}`,
    },
    { displaylogo: false, responsive: true },
  );
}

function attachCurvePanelEvents(v) {
  if (!v.panels.curve) return;
  v.panels.curve.on("plotly_click", (event) => {
    if (v.roiMean.mask || v.view.map_fixed) return;
    choose(v, { k: event.points[0].pointIndex });
    v.el.focus({ preventScroll: true });
  });
  v.panels.curve.on("plotly_selected", (event) => {
    const range = event?.range?.x;
    if (!v.view.time || v.roiMean.mask || !range) return;
    sendTimeCourse(v, { range: [Math.min(...range), Math.max(...range)] });
    // The red band shows the range; Plotly's selection box would keep its handles.
    v.Plotly.relayout(v.panels.curve, { selections: [] });
  });
  v.panels.curve.on("plotly_deselect", () => {
    if (v.view.time && !v.timeCourse.follows_point) sendTimeCourse(v, { range: null });
  });
}

// ---- browser/controls_processing.js ----

// Control groups for the processing settings that Python recomputes
// ("slices", "spectrum") and the "save" button. Each function returns the HTML elements of its group.

// One slider per dimension that is neither image nor curve; Python answers
// a released slider with a new block.
function sliceControls(v) {
  const controls = v.model.get("_controls");
  const items = [];
  if ((v.view.variable_options ?? []).length > 1) {
    // A fit result: choose the variable shown as map.
    const variable = select(v.view.variable_options, controls.variable);
    variable.addEventListener("change", () => sendControls(v, { variable: variable.value }));
    items.push(labelled("variable", variable));
  }
  if (controls.split_metabolites !== undefined) {
    // Interleaved metabolites: split the repetitions into metabolite_idx.
    const split = element("input");
    split.type = "checkbox";
    split.checked = controls.split_metabolites;
    split.title = "Split alternating repetitions into two metabolites";
    split.addEventListener("change", () => sendControls(v, { split_metabolites: split.checked }));
    items.push(labelled("split metabolites", split));
    if (controls.split_metabolites) {
      const other = element("input");
      other.type = "checkbox";
      other.checked = controls.other_metabolite;
      other.title = "Also draw the curve of the other metabolite at the selected voxel";
      other.addEventListener("change", () => sendControls(v, { other_metabolite: other.checked }));
      items.push(labelled("other metabolite", other));
    }
  }
  if (v.view.view_plane_options.length > 1) {
    // Three-dimensional images: the dimension perpendicular to the image.
    const plane = select(v.view.view_plane_options, controls.view_plane);
    plane.title = "Show the image perpendicular to this dimension";
    plane.addEventListener("change", () => sendControls(v, { view_plane: plane.value }));
    items.push(labelled("view plane", plane));
  }
  if (!v.view.single_voxel) {
    const rotate = button(`rotate ${controls.rotation}°`, "Turn the image by a further 90°, as the rotate button of plot");
    rotate.addEventListener("click", () =>
      sendControls(v, { rotation: (controls.rotation + 90) % 360 })
    );
    items.push(rotate);
  }
  for (const [dim, size] of Object.entries(v.view.other_dims)) {
    if (size < 2) continue;
    // Text coordinates such as metabolite names are shown next to the index.
    const names = v.view.other_values?.[dim];
    const shown = (index) => (names ? `${index} ${names[index]}` : `${index}`);
    const slider = element("input");
    slider.type = "range";
    slider.min = 0;
    slider.max = size - 1;
    slider.value = controls.indices?.[dim] ?? 0;
    const value = element("span", "hm-csi-value", shown(slider.value));
    // While the slider is dragged, every new index is sent (see
    // sendSliceIndex), so the image and the slice bands of linked views follow.
    slider.addEventListener("input", () => {
      value.textContent = shown(slider.value);
      v.draggingSlice = true;
      sendSliceIndex(v, dim, Number(slider.value));
    });
    slider.addEventListener("change", () => {
      v.draggingSlice = false;
      sendSliceIndex(v, dim, Number(slider.value));
    });
    const group = labelled(dim, slider);
    group.append(value);
    items.push(group);
  }
  return items;
}

// At most one slice request is on its way to Python. A newer index waits in
// v.sliceRequest and is sent when the block of the previous one arrives
// (onNewBlock), so a fast drag skips intermediate slices instead of queueing
// them. A request older than two seconds counts as lost.
function sendSliceIndex(v, dim, index) {
  v.sliceRequest = { dim, index };
  const busy = v.requestSentAt !== null && performance.now() - v.requestSentAt < 2000;
  if (!busy) sendWaitingSliceIndex(v);
}

function sendWaitingSliceIndex(v) {
  const request = v.sliceRequest;
  v.sliceRequest = null;
  if (!request) return;
  const indices = v.model.get("_controls").indices ?? {};
  if (indices[request.dim] === request.index) return;
  sendControls(v, { indices: { ...indices, [request.dim]: request.index } });
}

// Images get only the complex part; unit and line broadening act on spectra.
// The processing controls (FID, points, denoising, repetitions, channels)
// follow below; Python sends only those that apply to the data.
function spectrumControls(v) {
  const controls = v.model.get("_controls");
  const part = select(v.view.spec_part_options, controls.spec_part);
  part.addEventListener("change", () => sendControls(v, { spec_part: part.value }));
  if (!v.view.spectroscopic) return [labelled("part", part), ...processingControls(v)];
  const unit = select(v.view.spec_unit_options, controls.spec_unit);
  unit.addEventListener("change", () => sendControls(v, { spec_unit: unit.value }));
  const broadening = element("input");
  broadening.type = "number";
  broadening.min = 0;
  broadening.step = 1;
  broadening.value = controls.line_broadening_hz;
  broadening.addEventListener("change", () =>
    sendControls(v, { line_broadening_hz: Number(broadening.value) || 0 }),
  );
  return [
    labelled("part", part),
    labelled("unit", unit),
    labelled("line broadening [Hz]", broadening),
    ...processingControls(v),
  ];
}

// Processing as in plot. Each change sends the whole "processing" setting;
// Python checks it, processes the data again and sends a new block.
function processingControls(v) {
  const processing = v.model.get("_controls").processing ?? {};
  const send = (change) => sendControls(v, { processing: { ...processing, ...change } });
  const number = (value, min, title) => {
    const input = element("input");
    input.type = "number";
    input.min = min;
    input.step = 1;
    input.value = value;
    input.title = title;
    input.style.width = "5em";
    return input;
  };
  const items = [];
  if (processing.show_fid !== undefined) {
    const fid = element("input");
    fid.type = "checkbox";
    fid.checked = processing.show_fid;
    fid.title = "Show the acquired time signal (FID) instead of the spectrum";
    fid.addEventListener("change", () => send({ show_fid: fid.checked }));
    items.push(labelled("FID", fid));
    const points = number(processing.npoints, 2, "Spectral points; more than acquired adds zeros to the FID (zero filling)");
    points.addEventListener("change", () => {
      const value = Math.round(Number(points.value));
      if (value >= 2) send({ npoints: value });
      else points.value = processing.npoints;
    });
    items.push(labelled("points", points));
  }
  const denoise = number(processing.denoise_components, 0, "Principal components kept by the PCA denoising; 0 is off");
  denoise.addEventListener("change", () =>
    send({ denoise_components: Math.max(0, Math.round(Number(denoise.value)) || 0) }),
  );
  items.push(labelled("denoise", denoise));
  if (processing.repetitions !== undefined) {
    const mode = select(v.view.repetition_modes, processing.repetitions);
    mode.title = "Mean or running sum over the repetition range";
    mode.addEventListener("change", () => send({ repetitions: mode.value }));
    const [first, last] = processing.repetition_range;
    const from = number(first, 0, "First repetition of the range");
    const to = number(last, 0, "Last repetition of the range");
    const sendRange = () => {
      const range = [Math.round(Number(from.value)) || 0, Math.round(Number(to.value)) || 0];
      send({ repetition_range: range });
    };
    from.addEventListener("change", sendRange);
    to.addEventListener("change", sendRange);
    const group = labelled("repetitions", mode);
    group.append(from, to);
    items.push(group);
  }
  if (processing.combine_channels !== undefined) {
    const combine = element("input");
    combine.type = "checkbox";
    combine.checked = processing.combine_channels;
    combine.title = "Combine the receive channels";
    combine.addEventListener("change", () => send({ combine_channels: combine.checked }));
    const method = select(v.view.combine_methods, processing.combine_method);
    method.disabled = !processing.combine_channels;
    method.addEventListener("change", () => send({ combine_method: method.value }));
    const group = labelled("combine channels", combine);
    group.append(method);
    items.push(group);
  }
  return items;
}

function saveControls(v) {
  if (!v.view.can_save_settings) return [];
  const save = button("save view", "Save these view settings on the scan for the next plot_scan");
  save.addEventListener("click", () => {
    v.status.textContent = "Saving view settings ...";
    v.model.send({ type: "save_settings" });
  });
  return [save];
}

// ---- browser/controls_curve_axes.js ----

// Control group "curve_scale": y axis and frequency window of the curve
// panel, and whether the fitted spectrum and its residual are drawn. They
// only change the curve; they are the synchronised `_curve_axes` trait
// (ScanView.set_curve_scale, set_frequency_window and show_fit_curves),
// which Python stores in state.spectral (couple_ylims, display_range,
// show_fit, show_fit_residual). Python sends new fit curves after the
// fit choices.

const CURVE_SCALES = [
  ["auto", "auto"],
  ["whole plane", "plane"],
  ["map colours", "map"],
];

function setCurveAxes(v, update) {
  v.model.set("_curve_axes", { ...v.model.get("_curve_axes"), ...update });
  v.model.save_changes();
  if (v.Plotly) drawCurvePanel(v);
}

function curveScaleControls(v) {
  if (v.view.curve_dim === null) return [];
  const axes = v.model.get("_curve_axes");
  const scale = select(CURVE_SCALES, axes.scale);
  scale.title =
    "y axis of the curve: fitted to the shown curves, the value range of the " +
    "whole plane, or the colour limits of the map (Couple Y-Limits in plot)";
  scale.addEventListener("change", () => setCurveAxes(v, { scale: scale.value }));
  const items = [labelled("curve y", scale)];
  if (!v.view.spectroscopic) return items;

  // Frequency window ("Limit" in plot), in the unit shown now. A window in
  // the other unit is kept in Python but not shown.
  const unit = v.model.get("_controls").spec_unit;
  const shown = frequencyWindow(v);
  const [low, high] = shown ?? finiteRange(v.view.curve_x);
  const limit = element("input");
  limit.type = "checkbox";
  limit.checked = shown !== null;
  limit.disabled = v.model.get("_controls").processing?.show_fid === true;
  limit.title = "Show only this frequency range; it stays for every voxel";
  const number = (value) => {
    const input = element("input");
    input.type = "number";
    input.step = "any";
    input.value = Number(value.toPrecision(6));
    input.style.width = "6em";
    return input;
  };
  const from = number(low);
  const to = number(high);
  const send = () => {
    const limits = [Number(from.value), Number(to.value)];
    if (!limit.checked) {
      setCurveAxes(v, { window: null });
    } else if (from.value !== "" && to.value !== "" && limits[0] !== limits[1]) {
      setCurveAxes(v, { window: limits, window_unit: unit });
    } else {
      v.status.textContent = "Enter two different numbers for the frequency window.";
    }
  };
  for (const input of [limit, from, to]) input.addEventListener("change", send);
  const group = labelled(`limit [${unit}]`, limit);
  group.append(from, to);
  items.push(group);

  // Fitted spectrum and residual (data − fit) of the selected voxel, as
  // "Show Fit" and "Show Residual" in plot (ScanView.show_fit_curves).
  const fit = element("input");
  fit.type = "checkbox";
  fit.checked = axes.fit !== false;
  fit.title = "Draw the fitted spectrum of the selected voxel when a fit is shown";
  fit.addEventListener("change", () => setCurveAxes(v, { fit: fit.checked }));
  const residual = element("input");
  residual.type = "checkbox";
  residual.checked = axes.residual !== false;
  residual.disabled = !fit.checked;
  residual.title = "Draw data − fit below the curves, shifted, with a dashed zero line";
  residual.addEventListener("change", () => setCurveAxes(v, { residual: residual.checked }));
  items.push(labelled("fit", needsPython(v, fit)), labelled("residual", needsPython(v, residual)));
  return items;
}

// The frequency window [low, high] that applies to the shown curve, or null:
// it applies to spectra shown in the unit the window was set in.
function frequencyWindow(v) {
  const axes = v.model.get("_curve_axes");
  const controls = v.model.get("_controls");
  if (!v.view.spectroscopic || !axes.window || controls.processing?.show_fid) return null;
  if (axes.window_unit !== controls.spec_unit) return null;
  return [Math.min(...axes.window), Math.max(...axes.window)];
}

// y range of the "map colours" scale, as couple_ylims in plot: from zero or
// above for the magnitude, symmetric around zero for the other parts (at
// most pi for the phase).
function mapCurveRange(v) {
  const [low, high] = mapColourLimits(v, planeValues(v, v.selection.curve_index));
  const part = v.model.get("_controls").spec_part;
  if (part === "Magnitude") return [Math.max(0, low), Math.max(0, high)];
  let maxAbs = Math.max(Math.abs(low), Math.abs(high));
  if (part === "Phase") maxAbs = Math.min(maxAbs, Math.PI);
  return [-maxAbs, maxAbs];
}

// y range of the traces inside the window [low, high] with a 5 % margin, as
// plot fits the y axis to a limited frequency range; null without values.
function windowCurveRange(traces, [low, high]) {
  const values = [];
  for (const trace of traces) {
    if (!trace.x || !trace.y) continue;
    for (let i = 0; i < trace.y.length; i += 1) {
      const x = trace.x[i];
      const y = trace.y[i];
      if (x >= low && x <= high && Number.isFinite(y)) values.push(y);
    }
  }
  if (!values.length) return null;
  const [yMin, yMax] = finiteRange(values);
  const margin = 0.05 * (yMax - yMin);
  return [yMin - margin, yMax + margin];
}

// x and y axis settings of the curve panel for the shown traces.
function curveAxes(v, traces) {
  const window = frequencyWindow(v);
  const xaxis = window
    ? { range: v.view.curve_invert_x ? [window[1], window[0]] : window, autorange: false }
    : { autorange: v.view.curve_invert_x ? "reversed" : true };
  const scale = v.model.get("_curve_axes").scale;
  let yRange = null;
  if (scale === "plane") yRange = planeRange(v);
  else if (scale === "map") yRange = mapCurveRange(v);
  else if (window) yRange = windowCurveRange(traces, window);
  const yaxis = yRange && yRange[0] < yRange[1] ? { range: yRange, autorange: false } : { autorange: true };
  return { xaxis, yaxis };
}

// Set from Python (ScanView.set_curve_scale, set_frequency_window).
function onCurveAxes(v) {
  buildGroups(v, ["curve_scale"]);
  if (v.Plotly) drawCurvePanel(v);
}

// ---- browser/controls_colour_range.js ----

// Control group "colour_range": range mode and limits of the map colours.
//
// The colour range only redraws: the browser sends it to Python, which stores
// it in state.spatial without recomputing. Two sliders set the lower and
// upper colour limit; their scale is percent or the values of the plane. Percentages refer to the shown map
// ("map") or the whole plane ("plane"); the whole-plane reference exists only
// in the browser.

// Shown names of the range modes; the values stay the names Python knows.
const RANGE_MODE_LABELS = {
  "Min/Max": "full range of the data",
  Absolute: "fixed values",
};

function colourRangeControls(v) {
  if (v.view.single_voxel) return [];
  const choices = [];
  for (const mode of v.view.range_modes) {
    if (mode === "Percentage") {
      choices.push(["% of this map", "Percentage map"], ["% of whole plane", "Percentage plane"]);
    } else {
      choices.push([RANGE_MODE_LABELS[mode] ?? mode, mode]);
    }
  }
  const choiceOf = (settings) =>
    settings.range_mode === "Percentage" ? `Percentage ${v.percentReference}` : settings.range_mode;
  const settings = v.model.get("_map_range");
  const mode = select(choices, choiceOf(settings));
  mode.title =
    "What the sliders refer to: percent of the values of the shown map or of the whole " +
    "plane, or the values themselves. The full range follows the data when the complex " +
    "part or line broadening changes; fixed values keep their limits.";
  mode.addEventListener("change", () => {
    const [rangeMode, reference] = mode.value.split(" ");
    const current = v.model.get("_map_range");
    const z = planeValues(v, v.selection.curve_index);
    // Keep the shown colours: convert the current limits to the new mode.
    const [low, high] = mapColourLimits(v, z, current);
    let limits = [low, high];
    if (rangeMode === "Percentage") {
      v.percentReference = reference;
      if (current.range_mode === "Percentage") {
        limits = [current.vmin, current.vmax];
      } else {
        const [start, end] = reference === "map" ? finiteRange(z.flat()) : planeRange(v);
        const span = end - start;
        // Percentages stay within 0-100 as in plot; limits outside the
        // reference range would otherwise show as values such as -300 %.
        const percent = (value) => Math.min(100, Math.max(0, ((value - start) / span) * 100));
        limits = [percent(low), percent(high)];
        if (!(limits[0] < limits[1])) limits = [0, 100];
      }
    }
    setMapRange(v, { range_mode: rangeMode, vmin: limits[0], vmax: limits[1] });
    // A new percentage reference with the same limits leaves _map_range
    // unchanged, so the listener does not redraw by itself.
    if (v.Plotly) drawImagePanel(v);
  });
  const [bottom, top, step] = sliderBounds(v, settings);
  const percent = settings.range_mode === "Percentage";
  const format = (value) => (percent ? `${Number(value).toFixed(1)} %` : `${Number(Number(value).toPrecision(4))}`);
  // While a slider moves, the map follows in this browser; Python gets the
  // limits when the slider is let go.
  const lower = rangeSlider(settings.vmin, bottom, top, step, format, (value, done) => {
    const upperValue = v.model.get("_map_range").vmax;
    const clipped = Math.min(value, upperValue - step);
    setMapRange(v, { vmin: clipped }, done);
    return clipped;
  });
  const upper = rangeSlider(settings.vmax, bottom, top, step, format, (value, done) => {
    const lowerValue = v.model.get("_map_range").vmin;
    const clipped = Math.max(value, lowerValue + step);
    setMapRange(v, { vmax: clipped }, done);
    return clipped;
  });
  lower.title = "Values at or below this limit get the first colour";
  upper.title = "Values at or above this limit get the last colour";
  v.mapRangeInputs = { mode, lower, upper, choiceOf };
  return [labelled("colours scaled to", mode), labelled("from", lower), labelled("to", upper)];
}

// Slider limits and step: 0-100 % for percentages, otherwise the values of
// the whole plane, widened to include the current limits.
function sliderBounds(v, settings) {
  if (settings.range_mode === "Percentage") return [0, 100, 0.5];
  const [start, end] = planeRange(v);
  const bottom = Math.min(start, settings.vmin);
  const top = Math.max(end, settings.vmax);
  const span = top - bottom;
  return [bottom, top, span > 0 ? span / 500 : 1];
}

// A slider with its value shown next to it. `change(value, done)` returns
// the accepted value; `done` is true when the slider is let go.
function rangeSlider(value, bottom, top, step, format, change) {
  const wrapper = element("span", "hm-csi-range-slider");
  const slider = element("input");
  slider.type = "range";
  slider.min = bottom;
  slider.max = top;
  slider.step = step;
  const readout = element("span", "hm-csi-range-value");
  wrapper.show = (number) => {
    slider.value = number;
    readout.textContent = format(number);
  };
  wrapper.show(value);
  wrapper.fits = (number) => number >= Number(slider.min) && number <= Number(slider.max);
  const send = (done) => wrapper.show(change(Number(slider.value), done));
  slider.addEventListener("input", () => send(false));
  slider.addEventListener("change", () => send(true));
  wrapper.append(slider, readout);
  return wrapper;
}

// Set the colour range; `send` false only redraws in this browser.
function setMapRange(v, update, send = true) {
  v.model.set("_map_range", { ...v.model.get("_map_range"), ...update });
  if (send) v.model.save_changes();
}

// Python or another view changed the range: show it and redraw.
function onMapRange(v) {
  const settings = v.model.get("_map_range");
  if (v.mapRangeInputs) {
    const { mode, lower, upper, choiceOf } = v.mapRangeInputs;
    const unitChanged = mode.value.startsWith("Percentage") !== (settings.range_mode === "Percentage");
    // New slider limits when the unit changes or a limit lies beyond them.
    if (unitChanged || !lower.fits(settings.vmin) || !upper.fits(settings.vmax)) {
      buildGroups(v, ["colour_range"]);
    } else {
      mode.value = choiceOf(settings);
      lower.show(settings.vmin);
      upper.show(settings.vmax);
    }
  }
  if (!v.Plotly) return;
  drawImagePanel(v);
  // The "map colours" curve scale follows the colour limits.
  if (v.model.get("_curve_axes").scale === "map") drawCurvePanel(v);
}

// ---- browser/controls_display.js ----

// Control group "display": how the map is drawn, as the display checkboxes
// of plot, the masks and the bands of the slices of other views. The settings are the
// synchronised `_display` trait
// (ScanView.set_display); Python stores them in the state. Everything only
// redraws the map, except the scalebar, whose length Python chooses, and the
// colour scales of map and anatomy, which Python sends with the view.

const DISPLAY_SWITCHES = [
  ["min_to_nan", "min → NaN", "Leave voxels below the colour minimum transparent"],
  ["show_scalebar", "scalebar", "Scalebar in the corner (only with a physical voxel spacing)"],
  ["show_colorbar", "colorbar", "Colour bar beside the map"],
  ["show_grid_lines", "grid", "Axis grid lines over the map"],
  ["show_tooltips", "tooltips", "Voxel indices, position, value and mask coverage under the mouse"],
  ["show_crosshair", "crosshair", "Dotted lines through the selected voxel"],
  ["show_masks", "masks", "Masks over the map (hidden masks are kept)"],
];

// Grid lines of every panel, as show_grid_lines in plot.
function showGrid(v) {
  return Boolean(v.model.get("_display").show_grid_lines);
}

function setDisplay(v, update) {
  v.model.set("_display", { ...v.model.get("_display"), ...update });
  v.model.save_changes();
  draw(v);
}

function displayControls(v) {
  if (v.view.single_voxel) return [];
  const display = v.model.get("_display");
  const smoothing = select(v.view.smoothing_options, display.smoothing);
  smoothing.title = "Smoothing between voxel centres (the voxel values stay the same)";
  smoothing.addEventListener("change", () => setDisplay(v, { smoothing: smoothing.value }));
  const cmap = select(v.view.map_cmaps, display.map_cmap);
  cmap.title = "Colour scale of the map (Python sends the new scale)";
  cmap.addEventListener("change", () => setDisplay(v, { map_cmap: cmap.value }));
  needsPython(v, cmap);
  const items = [labelled("map colours", cmap), labelled("smoothing", smoothing)];
  for (const [name, text, title] of DISPLAY_SWITCHES) {
    const box = element("input");
    box.type = "checkbox";
    box.checked = display[name];
    box.title = title;
    box.addEventListener("change", () => setDisplay(v, { [name]: box.checked }));
    if (name === "show_scalebar") needsPython(v, box);
    items.push(labelled(text, box));
  }
  if ((v.model.get("_slice_lines") || []).length) {
    const box = element("input");
    box.type = "checkbox";
    box.checked = display.show_slice_lines === true;
    box.title = "Bands where the slices shown in the other views cross this image";
    box.addEventListener("change", () => setDisplay(v, { show_slice_lines: box.checked }));
    items.push(labelled("other slices", box));
  }
  return items;
}

// Set from Python (ScanView.set_display): show the new settings and redraw.
function onDisplay(v) {
  buildGroups(v, ["display"]);
  if (v.Plotly) draw(v);
}

// ---- browser/controls_anatomy.js ----

// Control group "anatomy": show the anatomy under the map and set how opaque
// the map above it is. Empty when no anatomy was given. Both only redraw.
// For a single voxel or slab it chooses the anatomy slice under the outline.

// Under a voxel or slab outline: a slider for the anatomy slice (Python
// draws the new slice and outline).
function outlineSliceControls(v) {
  const outline = v.view.outline;
  const items = [];
  if (outline.n_slices > 1) {
    const slider = element("input");
    slider.type = "range";
    slider.min = 0;
    slider.max = outline.n_slices - 1;
    slider.value = outline.slice_index;
    const value = element("span", "hm-csi-value", slider.value);
    slider.addEventListener("input", () => (value.textContent = slider.value));
    slider.addEventListener("change", () =>
      sendControls(v, { anatomy_slice: Number(slider.value) }),
    );
    const group = labelled(`anatomy ${outline.slice_dim}`, slider);
    group.append(value);
    items.push(group);
  }
  if (v.view.anatomy.warning) {
    items.push(element("span", "hm-csi-mask-error", v.view.anatomy.warning));
  }
  return items;
}

function anatomyControls(v) {
  if (v.view.single_voxel && v.view.outline?.kind) return outlineSliceControls(v);
  if (!v.view.anatomy?.shape || v.view.single_voxel) return [];
  const visible = element("input");
  visible.type = "checkbox";
  visible.checked = v.showAnatomy;
  const opacity = opacitySlider(
    v.model.get("_anatomy_opacity"),
    "Opacity of the CSI map above the anatomy (0 shows only the anatomy)",
  );
  opacity.disabled = !v.showAnatomy;
  visible.addEventListener("change", () => {
    v.showAnatomy = visible.checked;
    opacity.disabled = !v.showAnatomy;
    drawImagePanel(v);
  });
  // Redrawn by onAnatomyOpacity; saved to Python when the slider is released.
  opacity.addEventListener("input", () => v.model.set("_anatomy_opacity", Number(opacity.value)));
  opacity.addEventListener("change", () => v.model.save_changes());
  v.anatomyOpacitySlider = opacity;
  // A colour scale other than the map's tells two overlaid grey images apart.
  const cmap = select(v.view.anatomy_cmaps, v.model.get("_display").anatomy_cmap);
  cmap.title = "Colour scale of the anatomy";
  cmap.addEventListener("change", () => setDisplay(v, { anatomy_cmap: cmap.value }));
  const items = [
    labelled("anatomy", visible),
    labelled("anatomy colours", cmap),
    labelled("map opacity", opacity),
  ];
  if (v.view.anatomy.warning) {
    items.push(element("span", "hm-csi-mask-error", v.view.anatomy.warning));
  }
  return items;
}

function onAnatomyOpacity(v) {
  const value = v.model.get("_anatomy_opacity");
  const slider = v.anatomyOpacitySlider;
  if (slider && Number(slider.value) !== value) slider.value = value;
  if (v.Plotly) drawImagePanel(v);
}

// ---- browser/controls_overlay.js ----

// Control group "overlay": a parameter map or other image above the CSI map.
// Empty when no overlay was given.
//
// Layer, metabolite, data source, slice, visibility, colormap and colour range
// are recomputed in Python; the opacity only redraws.

function overlayControls(v) {
  const settings = v.model.get("_controls").overlay;
  if (!settings || v.view.single_voxel) return [];
  const options = v.view.overlay_options;
  const send = (update) =>
    sendControls(v, { overlay: { ...v.model.get("_controls").overlay, ...update } });
  // A new layer, metabolite or range mode starts from its full colour
  // range, which Python sets when no limits are sent.
  const sendSelection = (update) => send({ ...update, vmin: null, vmax: null });
  const visible = element("input");
  visible.type = "checkbox";
  visible.checked = settings.visible;
  visible.addEventListener("change", () => send({ visible: visible.checked }));
  const layer = select(options.variables, settings.variable);
  layer.addEventListener("change", () => sendSelection({ variable: layer.value, metabolite: null }));
  const items = [labelled("overlay", visible), labelled("layer", layer)];
  if (options.metabolites.length) {
    const metabolite = select(options.metabolites, settings.metabolite);
    metabolite.addEventListener("change", () => sendSelection({ metabolite: metabolite.value }));
    items.push(labelled("metabolite", metabolite));
  }
  if (options.data_sources?.length) {
    // Python chooses the layer, range and slice of the new source.
