---
# External sequence categories, scanner aliases and vendor scopes.
# Maintained sequence types belong to sequences/_sequence_types.py.
#
# This is the canonical sequence-identification configuration used by Study,
# create_experiment, and reconstruction alias resolution. Add exact raw method
# aliases here when a custom scanner method should load as an existing sequence.

sequences:
  # Anatomical sequences
  flash:
    category: anatomical
    method_patterns:
      - "exact:flash"
      - "exact:<Bruker:FLASH>"
      - "exact:<User:sliceprofile_FLASH>"
      - "exact:<User:slicprof_inv_mk1>"
      - "exact:<User:sliceprofile_FLASHv3>"
      - "exact:<User:sliceprof_SP_FLASH>"
      - "exact:<User:wgslic_prof_PRESS>"
      - "exact:<User:wgslicprof_sLASER>"
      - "exact:<User:wgslic_prof_PRESS3D>"
      - "exact:<User:sliceprofSP_selFLASH>"
      - "exact:<User:stock_FLASH>"
      - "exact:<User:wgslicprof_sLASER_2>"
      - "exact:<User:lucaFLASH_1D>"
      - "exact:<User:low_matrixsize_FLASH>"
      - "exact:<User:lowresFLASH>"
      - "exact:<User:measure_3D_sliceprof>"
      - "exact:<User:flash_no_slice_grad>"
      - "contains:flash"

  bssfp:
    category: anatomical
    method_patterns:
      - "exact:bssfp"
      - "exact:<Bruker:FISP>"
      - "exact:<User:fisp_grad_1metab_CS>"
      - "exact:<User:fisp_grad_1metab_CS2>"
      - "exact:<User:fisp_gr_1_met_CS_me>"
      - "exact:<User:jakob_fisp_me>"
      - "exact:<User:fisp_me_backup>"
      - "exact:<User:altPowRx_G_FISP>"
      - "exact:<User:altPow_jgs_alt_FISP>"
      - "exact:<User:altPowRx_G_FISP_luca>"
      - "exact:<User:me_bssfp_jakob>"
      - "contains:bssfp"
      - "contains:fisp"

  b1calibration:
    category: anatomical
    method_patterns:
      - "exact:b1calibration"
      - "exact:<User:max_B1shapelist_4>"
      - "exact:<User:lucaB1shapelist_1>"
      - "contains:b1calibration"
      - "contains:b1shapelist"

  dtiepi:
    category: anatomical
    method_patterns:
      - "exact:dtiepi"
      - "exact:<Bruker:DtiEpi>"
      - "contains:dtiepi"
      - "contains:dti_epi"

  epi:
    category: anatomical
    method_patterns:
      - "exact:epi"
      - "exact:spspepi"
      - "exact:<Bruker:EPI>"
      - "exact:<User:lucaEPI>"
      - "exact:<User:lucaEPIspiral>"
      - "exact:<User:lucaEPIspiralTraj>"
      - "exact:<User:spsp_EPI>"
      - "contains:spspepi"
      - "contains:epi"

  fair_rare:
    category: anatomical
    method_patterns:
      - "exact:fair_rare"
      - "exact:<Bruker:FAIR_RARE>"
      - "contains:fair_rare"
      - "contains:fair-rare"
      - "contains:fair"

  fexi:
    category: diffusion
    method_patterns:
      - "exact:fexi"
      - "exact:<Bruker:FEXI>"
      - "contains:fexi"

  fieldmap:
    category: anatomical
    method_patterns:
      - "exact:fieldmap"
      - "exact:<Bruker:FieldMap>"
      - "contains:fieldmap"

  mge:
    category: anatomical
    method_patterns:
      - "exact:mge"
      - "exact:epsi"
      - "exact:<Bruker:MGE>"
      - "exact:<Bruker:EPSI>"
      - "exact:<User:multislice_EPSI>"
