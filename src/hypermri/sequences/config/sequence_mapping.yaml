      - "exact:single_pulse"
      - "exact:polarizationmonitoring13c"
      - "exact:<Bruker:SINGLEPULSE>"
      - "exact:<User:spsp_SinglePulse>"
      - "exact:<User:dual_job_Singlepulse>"
      - "exact:<User:lucaSP_inc_ref>"
      - "exact:<User:PolarizationMonitoring13C>"
      - "contains:polarizationmonitoring13c"
      - "contains:singlepulse"
      - "contains:single_pulse"
      - "contains:single"

  gnspect_ms:
