  ivrecovery:
    category: spectroscopy
    method_patterns:
      - "exact:ivrecovery"
      - "exact:iv_recovery"
      - "exact:<User:wg_IV_Recovery>"
      - "exact:<User:wg_IVRecov_1IVT>"
