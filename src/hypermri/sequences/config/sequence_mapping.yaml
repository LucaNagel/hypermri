    method_patterns:
      - "exact:semilaser"
      - "exact:semi_laser"
      - "exact:semi-laser"
      - "exact:<User:wg_sLASER>"
      - "exact:<User:wg_mv_sLASER>"
      - "exact:<User:wg_press_adiab_mk3>"
      - "exact:<User:wg_press_adiab_mk4>"
      - "exact:<User:wg_press_adiab_mk5>"
      - "exact:<User:wg_press_adiab_mk6>"
      - "exact:<User:wg_press_adiab_mk7>"
      - "exact:<User:wg_mvslaser_self>"
      - "contains:semilaser"
      - "contains:semi_laser"
      - "contains:semi-laser"
      - "contains:slaser"
      - "contains:laser"

  # Relaxometry sequences
  cpmg:
    category: spectroscopy
    method_patterns:
