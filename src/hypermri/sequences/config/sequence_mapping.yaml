      - "exact:agilent_spectroscopy"
      - "exact:<Bruker:NSPECT>"
      - "exact:<User:gNSPECT>"
      - "contains:nspect"

  geoffslcspec:
    category: spectroscopy
    method_patterns:
      - "exact:geoffslcspec"
      - "exact:geoff_slc_spec"
      - "exact:<User:geoffSlcSpec_12>"
      - "contains:geoffslcspec"
      - "contains:geoff_slc_spec"
