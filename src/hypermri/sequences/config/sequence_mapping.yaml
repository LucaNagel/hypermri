      - "contains:epsi"

  rarevtr:
    category: anatomical
    method_patterns:
      - "exact:rarevtr"
      - "exact:<Bruker:RAREVTR>"
      - "contains:rarevtr"

  rare:
    category: anatomical
    method_patterns:
      - "exact:rare"
      - "exact:<Bruker:RARE>"
      - "contains:rare"

  spin_echo:
    category: anatomical
    method_patterns:
      - "exact:se"
      - "exact:se2d1"

  # Spectroscopy sequences
  csi:
    category: spectroscopy
    method_patterns:
      - "exact:csi"
      - "exact:<Bruker:CSI>"
      - "exact:<User:lucaCSI>"
      - "exact:<User:lucaCSI2>"
      - "exact:<User:lucaCSI3>"
      - "exact:<User:lucaCSI4>"
      - "exact:<User:geoffCSI>"
      - "exact:<User:csi_fix>"
