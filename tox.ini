[tox]
minversion = 4.1.2
envlist =
    format
    deps
    python3.12
isolated_build = true

[gh-actions]
python =
    3.12: format, deps, python3.12

[testenv]
description = install package with [dev] extras in a virtual environment and invoke pytest
setenv =
    PYTHONPATH = {toxinidir}
extras = dev
commands =
    python -m pytest --basetemp={envtmpdir}


[testenv:format]
description = verify Ruff formatting without changing the working tree
deps = ruff==0.15.1
skip_install = true
commands = ruff format --check .

[testenv:deps]
description = check that all package imports are declared in pyproject.toml dependencies
deps =
    tomli>=1.2.0
skip_install = true
commands =
    python {toxinidir}/scripts/hooks/validate_dependencies.py
