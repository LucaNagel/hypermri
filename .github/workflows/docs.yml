name: Docs

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (refs/tags/v4)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (refs/tags/v5)
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build HTML documentation
        run: sphinx-build -b html docs/source docs/_build/html -W --keep-going

      - name: Build linkcheck (optional)
        run: sphinx-build -b linkcheck docs/source docs/_build/linkcheck
        continue-on-error: true
