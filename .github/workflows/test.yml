---
name: Tests

'on':
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-snapshot-audit:
    name: Public snapshot safety audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check the prospective public snapshot
        run: python scripts/audit_public_snapshot.py

      - name: Check release-policy consistency
        run: python scripts/check_release_readiness.py --allow-pending

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Check declared runtime dependencies
        run: python scripts/hooks/validate_dependencies.py

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run unit tests
        run: >-
          python -m pytest tests/unit
          --tb=short
          --cov=hypermri
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=46
          -q

      - name: Run synthetic notebook kernel test
        env:
          MPLBACKEND: Agg
        run: >-
          python -m pytest tests/integration/test_notebook_kernel.py
          -o addopts= -q --tb=short

  integration-tests:
    name: BrukerAPI PV6.0.1 reference-data tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ${{
        vars.ENABLE_APPROVED_REAL_DATA_TESTS == 'true' &&
        (github.event_name == 'workflow_dispatch' ||
         github.event_name == 'schedule' ||
         (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore the pinned Zenodo archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/data/.downloads/20200612_094625_lego_phantom_3_1_2.zip
          key: brukerapi-pv601-archive-fc273fe4d498f99cd75c4ae39cb64ba0522317c4f6abee1ad40206a2a70fc203

      - name: Prepare real integration-test data
        run: >-
          python scripts/download_test_data.py
          --dataset brukerapi_pv601_lego_phantom

      - name: Run integration tests
        run: python -m pytest -m integration --require-real-data --tb=short -q
