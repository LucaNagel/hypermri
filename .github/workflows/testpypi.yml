---
name: Publish to TestPyPI

'on':
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*rc*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (refs/tags/v4)
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (refs/tags/v5)
        with:
          python-version: "3.12"

      - name: Validate release approvals before enabling upload
        if: ${{ vars.ENABLE_TESTPYPI_PUBLISHING == 'true' }}
        run: python scripts/check_release_readiness.py

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build packaging twine

      - name: Clean build artifacts
        run: python scripts/clean_build_artifacts.py --apply

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Validate tag and distribution identities
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: >-
          python scripts/validate_release_artifacts.py
          --channel testpypi
          --tag "$RELEASE_TAG"
          --ref-type "$RELEASE_REF_TYPE"
          --dist-dir dist

      - name: Store the release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (refs/tags/v4)
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  quality:
    name: Validate release source and reference data
    needs: build
    uses: ./.github/workflows/release-quality.yml
    permissions:
      contents: read

  test-wheel:
    name: Test wheel on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (refs/tags/v4)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (refs/tags/v5)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the built distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (refs/tags/v4)
        with:
          name: python-package-distributions
          path: dist/

      - name: Install and test the wheel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', f'{wheel}[test]'])"
          python -c "import os, hypermri; expected = os.environ['RELEASE_TAG'].removeprefix('v'); assert hypermri.__version__ == expected, (hypermri.__version__, expected)"
          python -m pip check
          hypermri-download-example-data --help
          python -m pytest tests/unit --tb=short -q

  publish:
    name: Publish tested distribution to TestPyPI
    needs: [build, quality, test-wheel]
    if: >-
      ${{
        github.ref_type == 'tag'
        && vars.ENABLE_TESTPYPI_PUBLISHING == 'true'
      }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      # Required by TestPyPI Trusted Publishing.
      id-token: write

    steps:
      - name: Download the tested distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (refs/tags/v4)
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (refs/heads/release/v1)
        with:
          repository-url: https://test.pypi.org/legacy/
