---
name: Release quality

'on':
  workflow_call:

permissions:
  contents: read

jobs:
  source-quality:
    name: Validate tagged source and documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Validate source and documentation
        run: |
          python scripts/audit_public_snapshot.py
          ruff check src tests scripts
          ruff format --check src tests scripts
          python scripts/hooks/validate_dependencies.py
          python -m pip check
          python -m pytest tests/integration/test_notebook_kernel.py -o addopts= -q --tb=short
          sphinx-build -E -a -b html docs/source docs/_build/html -W --keep-going

  reference-data:
    name: Validate BrukerAPI PV6.0.1 reference data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download the built distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Install the wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', f'{wheel}[test]'])"
          python -m pip check
          python -c "from pathlib import Path; import hypermri, sysconfig; expected = Path(sysconfig.get_path('purelib')).resolve(); assert Path(hypermri.__file__).resolve().is_relative_to(expected), hypermri.__file__"

      - name: Restore the pinned Zenodo archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/data/.downloads/20200612_094625_lego_phantom_3_1_2.zip
          key: brukerapi-pv601-archive-fc273fe4d498f99cd75c4ae39cb64ba0522317c4f6abee1ad40206a2a70fc203

      - name: Prepare real integration-test data
        run: >-
          python scripts/download_test_data.py
          --dataset brukerapi_pv601_lego_phantom

      - name: Run real-data regression tests
        run: python -I -m pytest -m integration --require-real-data --tb=short -q
